    <rect x="3" y="3" width="18" height="18" rx="5"/>
    <circle cx="12" cy="12" r="4.2"/>
    <path d="M17.3 6.7h.01"/>
  </g>
  <g fill="none" stroke="#16e0ff" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round">
    <rect x="3" y="3" width="18" height="18" rx="5"/>
    <circle cx="12" cy="12" r="4.2"/>
    <path d="M17.3 6.7h.01"/>
  </g>
</svg>
