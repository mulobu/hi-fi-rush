<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Comic Page Overlay — Vertical</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bangers&family=Permanent+Marker&family=Caveat:wght@600;700&family=Baloo+2:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ============================================================
   TOKENS — palette identical to overlay.html by design. The two pages
   share a look and nothing else; see CLAUDE.md §2 on the mascot for
   the same arrangement.
   ============================================================ */
      :root {
        --ink: #16161d;
        --gutter: #aebcc9;
        --yellow: #f5d030;
        --marker: #d93028;
        --peri: #b9c3d6;
        --navy: #3b4a9e;
        --cyan: #35d6e8;
        --paper: #f4f1e8;
        --mint: #3fb98a;
        --plum: #6b3f8f;

        --canvas-w: 1080px;
        --canvas-h: 1920px;
        --page-w: 4320px;
        --page-h: 7680px;
        /* Derived the same way the horizontal 3000 was: every ordered pair of
           panels stepped through the real easing, measuring how far outside
           the page the camera sees. Peak here is end -> start, 1061 page px
           at 549ms — far below the horizontal page's 2187 because the
           vertical panel scales are uniform, with no 0.33-scale chat outlier
           to pan through. 1500 is 41% headroom, the same ratio 3000 carries
           over 2187, and 50 whole 30px halftone tiles so the skirt's dots
           stay in phase with the page's. */
        --page-skirt: 1500px;

        --beat-ms: 500ms;
        --pan-ms: 980ms;
        --snap: cubic-bezier(0.32, 1.38, 0.48, 1);

        --f-display: "Bangers", "Arial Black", sans-serif;
        --f-marker: "Permanent Marker", cursive;
        --f-scrawl: "Caveat", cursive;
        --f-body: "Baloo 2", system-ui, sans-serif;

        --wobble: 240px 18px 200px 22px / 20px 210px 24px 230px;
        --wobble-sm: 80px 8px 70px 10px / 9px 74px 11px 78px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        /* Transparent, so a dead browser source degrades to whatever OBS has
           behind it rather than a white box. CLAUDE.md §6. */
        background: transparent;
        font-family: var(--f-body);
        color: var(--paper);
        overflow: hidden;
        width: var(--canvas-w);
        height: var(--canvas-h);
      }

      /* ============================================================
   FRAME — the viewport IS the vertical OBS canvas, 1080 x 1920.

   Nothing scales it, so 1px here is 1px on that canvas and
   getBoundingClientRect() goes straight to SetSceneItemTransform with
   no conversion — exactly as on the horizontal page, just a different
   rectangle.
   ============================================================ */
      .viewport {
        position: fixed;
        top: 0;
        left: 0;
        width: var(--canvas-w);
        height: var(--canvas-h);
        overflow: hidden;
        background: transparent;
      }
      .shaker {
        position: absolute;
        inset: 0;
      }
      .shaker.shake {
        animation: shake 180ms steps(3, end);
      }
      @keyframes shake {
        0% {
          transform: translate(0, 0);
        }
        30% {
          transform: translate(-9px, 6px);
        }
        60% {
          transform: translate(7px, -7px);
        }
        100% {
          transform: translate(0, 0);
        }
      }

      .page {
        position: absolute;
        top: 0;
        left: 0;
        width: var(--page-w);
        height: var(--page-h);
        transform-origin: 0 0;
        transition: transform var(--pan-ms) var(--snap);
        will-change: transform;
        /* Paints nothing, deliberately. A mask applies to the whole subtree;
           .page-under carries the paint as a sibling of the panels instead. */
      }
      /* Gutter and halftone in five elements that read as one surface. The
         shape that must never come back is a single element at
         inset: -SKIRT — unmasked, it seals every cut in .page-under back up
         and there is no video anywhere, on any scene. See CLAUDE.md §2. */
      .skirt-n,
      .skirt-s,
      .skirt-w,
      .skirt-e {
        position: absolute;
        background: var(--gutter);
      }
      .skirt-n,
      .skirt-s {
        left: calc(-1 * var(--page-skirt));
        right: calc(-1 * var(--page-skirt));
        height: var(--page-skirt);
      }
      .skirt-n {
        top: calc(-1 * var(--page-skirt));
      }
      .skirt-s {
        top: 100%;
      }
      .skirt-w,
      .skirt-e {
        top: 0;
        height: var(--page-h);
        width: var(--page-skirt);
      }
      .skirt-w {
        left: calc(-1 * var(--page-skirt));
      }
      .skirt-e {
        left: 100%;
      }
      .page-under {
        position: absolute;
        inset: 0;
        background: var(--gutter);
      }
      .skirt-n::before,
      .skirt-s::before,
      .skirt-w::before,
      .skirt-e::before,
      .page-under::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: radial-gradient(var(--ink) 32%, transparent 33%);
        background-size: 30px 30px;
        opacity: 0.1;
      }

      /* ============================================================
   PANELS
   ============================================================ */
      .panel {
        position: absolute;
        overflow: hidden;
        cursor: pointer;
        border: 15px solid var(--ink);
        border-radius: var(--wobble);
        box-shadow: 22px 22px 0 rgba(22, 22, 29, 0.55);
      }
      /* On .under, not .panel — on .panel it would tile over the live video
         inside every hole. Same box either way. */
      .under::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: radial-gradient(
          rgba(22, 22, 29, 0.85) 30%,
          transparent 31%
        );
        background-size: 26px 26px;
        opacity: 0.18;
        mix-blend-mode: multiply;
      }

      /* HOLES — transparent windows. One OBS source sits behind each. */
      .hole {
        position: absolute;
        background: transparent;
        overflow: hidden;
        border: 11px solid var(--ink);
        border-radius: var(--wobble-sm);
        box-shadow: 12px 12px 0 rgba(22, 22, 29, 0.6);
      }
      .hole.bare {
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
      .under {
        position: absolute;
        inset: 0;
      }
      .fake-source {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: repeating-linear-gradient(
          45deg,
          rgba(22, 22, 29, 0.34) 0 40px,
          rgba(22, 22, 29, 0.14) 40px 80px
        );
      }
      .src-label {
        display: none;
      }
      .hole.punched .fake-source {
        display: none;
      }

      /* tags */
      .panel-tag {
        position: absolute;
        bottom: 32px;
        left: 32px;
        background: var(--ink);
        color: var(--paper);
        font-family: var(--f-display);
        font-size: 50px;
        letter-spacing: 0.06em;
        padding: 8px 24px 4px;
        transform: rotate(-1.2deg);
        box-shadow: 11px 11px 0 var(--marker);
        pointer-events: none;
        z-index: 8;
        animation: tagPulse var(--beat-ms) var(--snap) infinite;
      }
      @keyframes tagPulse {
        0% {
          transform: rotate(-1.2deg) scale(1.045);
        }
        45%,
        100% {
          transform: rotate(-1.2deg) scale(1);
        }
      }
      .panel.is-live .panel-tag {
        box-shadow: 11px 11px 0 var(--cyan);
      }

      /* shared decorations */
      .speedlines {
        position: absolute;
        inset: -30%;
        pointer-events: none;
        background: repeating-conic-gradient(
          from 0deg at 50% 50%,
          rgba(22, 22, 29, 0.3) 0deg 1deg,
          transparent 1deg 3.4deg
        );
        animation: spin 42s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .rays {
        position: absolute;
        inset: -40%;
        pointer-events: none;
        background: repeating-conic-gradient(
          from 0deg at 50% 50%,
          rgba(255, 255, 255, 0.3) 0deg 4deg,
          transparent 4deg 11deg
        );
        animation: spin 26s linear infinite reverse;
      }
      .bubble {
        position: absolute;
        background: var(--paper);
        border: 10px solid var(--ink);
        border-radius: var(--wobble-sm);
        padding: 18px 30px;
        font-family: var(--f-body);
        font-weight: 700;
        color: var(--ink);
        z-index: 7;
      }
      .bubble::after {
        content: "";
        position: absolute;
        bottom: -52px;
        left: 44px;
        border: 26px solid transparent;
        border-top-color: var(--ink);
      }
      .stamp {
        position: absolute;
        display: grid;
        place-items: center;
        font-family: var(--f-display);
        color: var(--yellow);
        -webkit-text-stroke: 12px var(--ink);
        paint-order: stroke fill;
        z-index: 7;
        animation: stampPulse calc(var(--beat-ms) * 2) var(--snap) infinite;
      }
      @keyframes stampPulse {
        0% {
          transform: rotate(-9deg) scale(1.14);
        }
        30%,
        100% {
          transform: rotate(-9deg) scale(0.96);
        }
      }
      .scrawl {
        position: absolute;
        font-family: var(--f-scrawl);
        font-weight: 700;
        color: var(--marker);
        z-index: 7;
        pointer-events: none;
      }

      /* SOCIALS — paper cut-outs taped to every scene panel.

         Sized in CANVAS px through --u, which the build sets to 1 / the
         panel's resting scale. Panels land anywhere from 0.33x (chat) to
         1.17x (cam) on the horizontal page, so page-px sizes would make the handle 3.5x bigger on
         one scene than another. Always lifted `over`: on game the whole panel
         is a hole, and under-art there would be painted over by the capture. */
      .socials {
        position: absolute;
        z-index: 7;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: calc(var(--u) * 8px);
        pointer-events: none;
      }
      .socials.row {
        flex-direction: row;
        align-items: center;
        gap: calc(var(--u) * 26px);
      }
      /* Two lines: the first two labels side by side, the third under them. */
      .soc-line {
        display: flex;
        align-items: center;
        gap: calc(var(--u) * 26px);
      }
      .soc-row {
        display: flex;
        align-items: center;
      }
      .socials .cut {
        width: calc(var(--u) * 82px);
        height: calc(var(--u) * 82px);
        margin-right: calc(var(--u) * -10px);
        filter: drop-shadow(
          calc(var(--u) * 5px) calc(var(--u) * 5px) 0 rgba(22, 22, 29, 0.55)
        );
        transform: rotate(var(--r, 0deg));
        animation: cutBob calc(var(--beat-ms) * 2) var(--snap) infinite;
      }
      .socials .cut:nth-child(1) {
        --r: -6deg;
      }
      .socials .cut:nth-child(2) {
        --r: 4deg;
        animation-delay: calc(var(--beat-ms) * -1.5);
      }
      .socials .cut:nth-child(3) {
        --r: -3deg;
        animation-delay: calc(var(--beat-ms) * -1);
      }
      @keyframes cutBob {
        0% {
          transform: rotate(var(--r, 0deg)) scale(1.1);
        }
        30%,
        100% {
          transform: rotate(var(--r, 0deg)) scale(1);
        }
      }
      /* Over live video nothing animates (§2) — the game panel is all hole. */
      .p-game .socials .cut {
        animation: none;
      }
      /* drop-shadow on the wrapper, because clip-path on the label clips
         any shadow the label casts itself. */
      .handle {
        margin-left: calc(var(--u) * 16px);
        filter: drop-shadow(
          calc(var(--u) * 5px) calc(var(--u) * 5px) 0 rgba(22, 22, 29, 0.55)
        );
      }
      .handle span {
        display: block;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--f-body);
        font-weight: 800;
        font-size: calc(var(--u) * 34px);
        line-height: 1;
        padding: calc(var(--u) * 12px) calc(var(--u) * 20px)
          calc(var(--u) * 7px);
        white-space: nowrap;
        transform: rotate(-2deg);
        /* Scissor-cut, not torn: straight facets at odd angles. */
        clip-path: polygon(
          0 8%, 22% 0, 51% 6%, 78% 0, 100% 5%,
          98% 52%, 100% 94%, 70% 100%, 38% 95%, 9% 100%, 1% 90%, 2% 48%
        );
      }
      .soc-row + .soc-row .handle span {
        transform: rotate(1.5deg);
      }

      /* ============================================================
   PANEL 1 — STREAM START   2072 x 2200
   Art above the webcam window, clock below it.
   ============================================================ */
      .p-start {
        background: var(--plum);
      }
      .p-start .big {
        position: absolute;
        left: 5%;
        top: 6%;
        font-family: var(--f-display);
        font-size: 250px;
        line-height: 0.82;
        color: var(--yellow);
        -webkit-text-stroke: 14px var(--ink);
        paint-order: stroke fill;
        transform: rotate(-2deg);
      }
      .p-start .clock {
        position: absolute;
        left: 6%;
        top: 78%;
        font-family: var(--f-display);
        font-size: 165px;
        color: var(--paper);
        -webkit-text-stroke: 10px var(--ink);
        paint-order: stroke fill;
        letter-spacing: 0.06em;
      }
      .p-start .scrawl {
        right: 14%;
        top: 8%;
        font-size: 105px;
        transform: rotate(-4deg);
      }

      /* ============================================================
   PANEL 3 — GAMEPLAY   1800 x 3200, exactly 9:16
   Game window on top, cam under it, art and tag in the third below.

   Background is navy, NOT --ink as on the horizontal page. There the
   Game hole is `bare` at 100% x 100%, so the panel background never
   renders a pixel and its colour is arbitrary. Here the two windows
   cover 50.3% of the panel and the other half IS the page — ink made
   that half a black slab with a scrawl in it. §4: flat saturated
   colour with a halftone grid over the top, like every other panel.
   ============================================================ */
      .p-game {
        background: var(--navy);
      }
      /* Static burst behind the windows. The shared .rays spins, which drags
         the eye off the windows it sits under; same conic gradient, origin at
         50% 43.5% so the vanishing point lands at canvas y764, in the 28px
         gap between cam and game, rather than inside either of them. The
         element is inset -30%, so that fraction is of 3043px, not of 1920. */
      .p-game .burst {
        position: absolute;
        inset: -30%;
        pointer-events: none;
        background: repeating-conic-gradient(
          from 0deg at 50% 43.5%,
          rgba(255, 255, 255, 0.14) 0deg 3deg,
          transparent 3deg 10deg
        );
      }
      /* Cyan on navy is legible but flat. The inked slab with a hard offset
         shadow is the panel-tag language the rest of the page speaks.

         Sized to fit the 60 canvas px between SAFE_TOP and the cam window:
         canvas 146-188. It used to be 84px at top 1.2%, which landed at
         canvas 31 — 109px above the safe line, inside the notch on every
         platform. */
      .p-game .strip {
        position: absolute;
        left: 4%;
        top: 7.2%;
        display: flex;
        align-items: center;
        gap: 18px;
        background: var(--ink);
        padding: 8px 24px 5px;
        font-family: var(--f-display);
        font-size: 56px;
        letter-spacing: 0.1em;
        color: var(--cyan);
        transform: rotate(-0.8deg);
        box-shadow: 9px 9px 0 rgba(22, 22, 29, 0.55);
      }
      .p-game .strip::before {
        content: "";
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--marker);
        animation: livePip var(--beat-ms) var(--snap) infinite;
      }
      @keyframes livePip {
        0% {
          transform: scale(1.35);
          opacity: 1;
        }
        55%,
        100% {
          transform: scale(1);
          opacity: 0.55;
        }
      }
      /* The band under the cam window, which was the worst of the black.
         Chevrons running on the beat — the page's own motion language, and
         a drawn edge that stops the lower third reading as void. Deliberately
         light: §8's vertical real-estate proposal wants this band. */
      .p-game .chevrons {
        position: absolute;
        left: -4%;
        right: -4%;
        top: 70.61%;
        height: 80px;
        border-top: 11px solid var(--ink);
        border-bottom: 11px solid var(--ink);
        transform: rotate(-1.1deg);
        background-image: repeating-linear-gradient(
          -62deg,
          var(--yellow) 0 54px,
          var(--ink) 54px 108px
        );
        animation: chevronRun calc(var(--beat-ms) * 2) linear infinite;
      }
      @keyframes chevronRun {
        to {
          background-position: 216px 0;
        }
      }

      /* ============================================================
   PANEL 4 — FULL CAM   1192 x 1576
   ============================================================ */
      .p-cam {
        background: var(--mint);
      }

      /* ============================================================
   PANEL 5 — BRB   1365 x 2056
   ============================================================ */
      .p-brb {
        background: var(--marker);
      }
      .p-brb .big {
        position: absolute;
        left: 5%;
        top: 6%;
        font-family: var(--f-display);
        font-size: 205px;
        line-height: 0.8;
        color: var(--yellow);
        -webkit-text-stroke: 14px var(--ink);
        paint-order: stroke fill;
        transform: rotate(-2.4deg);
      }
      /* Where the mascot lands. Drawn, never punched — a hole is a transparent
         rectangle, and the mascot's own alpha needs comic art behind it, not
         live video. The vertical panel has room to put it below the type
         rather than beside it. */
      .p-brb .mascot-frame {
        position: absolute;
        left: 14%;
        top: 38%;
        width: 62%;
        height: 40%;
        border: 11px solid var(--ink);
        border-radius: var(--wobble-sm);
        background:
          repeating-linear-gradient(
            -18deg,
            rgba(255, 255, 255, 0.16) 0 26px,
            transparent 26px 84px
          ),
          var(--peri);
        box-shadow: 12px 12px 0 rgba(22, 22, 29, 0.6);
      }
      .p-brb .tape {
        position: absolute;
        width: 150px;
        height: 46px;
        background: rgba(244, 241, 232, 0.72);
        border: 3px solid rgba(22, 22, 29, 0.35);
      }
      .p-brb .tape.l {
        left: -46px;
        top: -18px;
        transform: rotate(-32deg);
      }
      .p-brb .tape.r {
        right: -46px;
        bottom: -18px;
        transform: rotate(-32deg);
      }

      /* ============================================================
   PANEL 6 — STREAM END   1365 x 2056
   ============================================================ */
      .p-end {
        background: var(--navy);
      }
      .p-end .big {
        position: absolute;
        left: 5%;
        top: 4%;
        font-family: var(--f-display);
        font-size: 132px;
        line-height: 0.82;
        color: var(--paper);
        -webkit-text-stroke: 12px var(--ink);
        paint-order: stroke fill;
        transform: rotate(-1.4deg);
      }
      .p-end .rank {
        right: 15%;
        top: 3%;
        width: 250px;
        height: 250px;
        font-size: 200px;
        line-height: 1;
      }
      .credits {
        position: absolute;
        left: 5%;
        bottom: 9.5%;
        width: 68%;
        height: 26%;
        overflow: hidden;
        z-index: 6;
        mask-image: linear-gradient(
          transparent 0%,
          #000 16%,
          #000 84%,
          transparent 100%
        );
        -webkit-mask-image: linear-gradient(
          transparent 0%,
          #000 16%,
          #000 84%,
          transparent 100%
        );
      }
      .credits ul {
        position: absolute;
        list-style: none;
        animation: roll 14s linear infinite;
      }
      .credits li {
        font-family: var(--f-body);
        font-weight: 700;
        font-size: 52px;
        color: var(--paper);
        opacity: 0.85;
        padding: 6px 0;
        white-space: nowrap;
      }
      @keyframes roll {
        from {
          transform: translateY(0);
        }
        to {
          transform: translateY(-50%);
        }
      }

      /* ============================================================
   PANEL 2 — CHAT   1104 x 3200, the tall one
   ============================================================ */
      .p-chat {
        background: var(--peri);
      }
      .p-chat .header {
        position: absolute;
        top: 188px;
        left: 26px;
        right: 26px;
        background: var(--ink);
        color: var(--yellow);
        font-family: var(--f-display);
        font-size: 88px;
        letter-spacing: 0.1em;
        padding: 14px 26px 8px;
        transform: rotate(-0.8deg);
        text-align: center;
        z-index: 7;
      }

      /* ============================================================
   ART PANELS
   ============================================================ */
      .p-board {
        background: var(--yellow);
      }
      .p-board .ink-circle {
        position: absolute;
        left: 7%;
        top: 22%;
        width: 52%;
        height: 40%;
        border: 13px solid var(--ink);
        border-radius: 50%;
        transform: rotate(-6deg);
      }
      .p-board .title {
        position: absolute;
        left: 13%;
        top: 30%;
        font-family: var(--f-marker);
        font-size: 180px;
        color: var(--marker);
        transform: rotate(-4deg);
      }
      .p-board .note {
        left: 28%;
        top: 66%;
        font-size: 125px;
        transform: rotate(-11deg);
      }
      .p-board .photo {
        position: absolute;
        border: 11px solid var(--ink);
        background: var(--peri);
        border-radius: var(--wobble-sm);
        display: grid;
        place-items: center;
        font-family: var(--f-display);
        font-size: 105px;
        color: var(--ink);
      }
      .p-board svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .p-board .dash {
        fill: none;
        stroke: var(--ink);
        stroke-width: 1.2;
        stroke-dasharray: 4 3;
        animation: march 2s linear infinite;
      }
      @keyframes march {
        to {
          stroke-dashoffset: -14;
        }
      }

      .p-np {
        background: var(--navy);
      }
      .np-label {
        position: absolute;
        top: 32px;
        left: 32px;
        font-family: var(--f-display);
        font-size: 64px;
        color: var(--yellow);
        letter-spacing: 0.08em;
      }
      .np-track {
        position: absolute;
        top: 126px;
        left: 32px;
        right: 32px;
        font-family: var(--f-body);
        font-weight: 700;
        font-size: 48px;
        color: var(--paper);
        opacity: 0.85;
      }
      .eq {
        position: absolute;
        bottom: 52px;
        left: 32px;
        right: 32px;
        height: 240px;
        display: flex;
        align-items: flex-end;

      @keyframes eqb {

        60%,

      /* Panel 9 is the LATEST board, not the alert — the alert is a
         camera-space inset. CLAUDE.md §5. */
      .p-latest {

      .p-latest .title {

      /* ============================================================
   DEBUG HUD — ?debug=1 only. Never rendered on a live overlay.
   ============================================================ */
      .hud {

    </style>

  <body>
    <div class="viewport" id="viewport">
      <div class="shaker" id="shaker"><div class="page" id="page"></div></div>
    </div>

    <div class="hud" id="hud" hidden>
      <h4>VERTICAL DEBUG</h4>
      <div id="hudState"></div>
      <div id="hudRects"></div>
      <div id="hudLog"></div>
    </div>

    <script>
      const PAGE_W = 4320,
        PAGE_H = 7680,
        CANVAS_W = 1080,
        CANVAS_H = 1920;

      /* Platform chrome, in canvas px. The union of TikTok's 140 / 324 / 164
         and YouTube Shorts' 120 / 300 / 96 — the vertical output goes to both
         through Restream, which fans one 1080 x 1920 encode out unchanged, so
         the strictest of the two governs every platform.

         A picture may run under the right rail; the action is centred and a
         covered corner of game capture costs nothing. Type may not. So the
         windows keep their full 977px width and only TEXT is held inside
         SAFE_RIGHT. SAFE_PAD is slack against a device with a taller notch. */
      const SAFE_TOP = 140,
        SAFE_BOTTOM = 324,
        SAFE_RIGHT = 164,
        SAFE_PAD = 12;

      const params = new URLSearchParams(location.search);
      const DEBUG = params.has("debug");

      /* ================================================================
   PANEL CONFIG — single source of truth, vertical page.

   Nine panels on a 4320 x 7680 page: six that are scenes, three art
   filler. Margin 64, gutter 48, unchanged from the horizontal page.

   holes[] are percentages of the panel's CONTENT box (panel minus its
   15px border), which is what the build below multiplies out. Every
   video hole is authored 16:9 against that box so fillTransform's crop
   takes essentially nothing off the source.
   ================================================================ */
      const PANELS = [
        {
          id: 1,
          key: "start",
          cls: "p-start",
          fit: "fit",
          x: 64,
          y: 64,
          w: 2072,
          h: 2200,
          rot: 0.9,
          tag: "STREAM START",
          /* Right of the countdown, text held inside SAFE_RIGHT. */
          socials: { at: "right:16%;top:78%", size: 0.8 },
          holes: [
            /* 84% of 2042 is 1715px; 44.46% of 2170 is 965px — 16:9 to within
               a pixel. Sits mid-panel so the type clears it above and the
               countdown clears it below. */
            {
              src: "Cam",
              x: 8,
              y: 30,
              w: 84,
              h: 44.46,
              label: "Webcam",
              c: "#4a3a1e",
            },
          ],
        },

        {
          id: 2,
          key: "chat",
          cls: "p-chat",
          fit: "fit",
          x: 1912,
          y: 2312,
          w: 1104,
          h: 3200,
          rot: -1.1,
          tag: "CHAT",
          /* Over the top of the chat window. The portrait panel fills the
             frame and the band under the window belongs to the tag, so there
             is no free page here — the top of the log is the oldest messages,
             the cheapest pixels on the panel. */
          socials: { at: "left:7%;top:13%", size: 0.75 },
          holes: [
            /* Chat is a portrait widget in a portrait panel, so this one is
               deliberately NOT 16:9 — cropping a chat log to 16:9 would throw
               away most of the messages. */
            {
              src: "Chat",
              x: 5,
              y: 11.6,
              w: 90,
              h: 72.6,
              label: "Chat browser",
              c: "#243a2e",
            },
          ],
        },

        {
          id: 3,
          key: "game",
          cls: "p-game",
          fit: "fill",
          x: 64,
          y: 2312,
          w: 1800,
          h: 3200,
          rot: 0.5,
          tag: "GAMEPLAY",
          /* In the info band, in the slot the scrawl had — left of the mascot
             (canvas x 610+), above the tag. */
          socials: { at: "left:4%;top:74.2%", layout: "pair", size: 0.65 },
          /* No speedlines here, unlike the horizontal game panel. .speedlines
             is 1deg of ink every 3.4deg AND it spins; the static .burst is
             3deg of white every 10deg. Run both and the two conic gradients
             beat against each other, and every phone views this canvas
             downscaled, which resolves the moire into a flat grey wash that
             reads as a broken panel. The horizontal page never hits it: its
             game hole is the whole panel, so no speedline is ever visible. */
          holes: [
            /* 1800 x 3200 is exactly 9:16, so `fill` renders 1080 x 1920 with
               zero crop and zero bleed — the only panel that clears §5's ~5%
               rule. Both windows are 92% of the 1770 x 3170 content box and
               16:9 against it: 1628 x 916 page px, 977 x 550 on canvas.

               CAM IS FIRST, AND THAT IS THE POINT. The windows used to run
               game-then-cam, with the cam narrower at 68%. Measured against
               the platform margins that put gameplay alone at 26% of frame,
               under the 40-50% every source gives for the primary zone, and
               put the face in the dead middle where mobile eyes do not go.
               Face top, game middle, engagement bottom is the composition the
               research converges on; equal-width stacked windows also read as
               two comic panels rather than one window and one inset.

               Canvas landings: cam 200-750, game 778-1328. Both clear
               SAFE_TOP and leave 1352-1596 for the band below. Coverage 52%.

               Neither is `bare`. On the horizontal page the game hole is the
               whole panel and has to be; here they sit stacked with art below,
               so both keep inked borders — and being stacked rather than
               nested, mergeCuts has no containment case to resolve. */
            {
              src: "Cam",
              x: 4,
              y: 10.04,
              w: 92,
              h: 28.9,
              label: "Webcam",
              c: "#4a3a1e",
            },
            {
              src: "Game",
              x: 4,
              y: 40.43,
              w: 92,
              h: 28.9,
              label: "Game capture",
              c: "#1e3a2e",
            },
          ],
        },

        {
          id: 4,
          key: "cam",
          cls: "p-cam",
          fit: "fit",
          x: 3064,
          y: 2312,
          w: 1192,
          h: 1576,
          rot: 1.3,
          tag: "CAM",
          /* Under the webcam window. */
          socials: { at: "left:6%;top:62%" },
          holes: [
            /* 88% of 1162 is 1023px; 37.2% of 1546 is 575px — 16:9. */
            {
              src: "Cam",
              x: 6,
              y: 20,
              w: 88,
              h: 37.2,
              label: "Webcam",
              c: "#4a3a1e",
            },
          ],
        },

        {
          id: 5,
          key: "brb",
          cls: "p-brb",
          fit: "fit",
          x: 64,
          y: 5560,
          w: 1365,
          h: 2056,
          rot: 1.1,
          tag: "BRB",
          /* Between BE RIGHT BACK and the mascot frame, left of the bubble. */
          socials: { at: "left:6%;top:24%", size: 0.8 },
          /* No holes. The mascot frame is drawn art, and leaving Cam unclaimed
             here lets the game panel bleeding into frame keep the webcam. */
          holes: [],
        },

        {
          id: 6,
          key: "end",
          cls: "p-end",
          fit: "fit",
          x: 1477,
          y: 5560,
          w: 1365,
          h: 2056,
          rot: -0.6,
          tag: "STREAM END",
          /* Under MISSION COMPLETE, above the webcam — the credits roll owns
             the space below it. */
          socials: { at: "left:8%;top:16.3%", size: 0.75 },
          holes: [
            /* 84% of 1335 is 1121px; 31.1% of 2026 is 630px — 16:9. */
            {
              src: "Cam",
              x: 8,
              y: 30,
              w: 84,
              h: 31.1,
              label: "Webcam",
              c: "#4a3a1e",
            },
          ],
        },

        {
          id: 7,
          key: "board",
          cls: "p-board",
          fit: "fit",
          x: 2184,
          y: 64,
          w: 2072,
          h: 2200,
          rot: -0.7,
          tag: "INTEL",
          holes: [],
        },

        {
          id: 8,
          key: "np",
          cls: "p-np",
          fit: "fit",
          x: 2890,
          y: 5560,
          w: 1366,
          h: 2056,
          rot: 1.5,
          tag: "NOW PLAYING",
          holes: [],
        },

        {
          id: 9,
          key: "latest",
          cls: "p-latest",
          fit: "fit",
          x: 3064,
          y: 3936,
          w: 1192,
          h: 1576,
          rot: -0.8,
          tag: "LATEST",
          holes: [],
        },
      ];

      /* Platforms that share a handle share a label. */
      const SOCIALS = [
        { handle: "thedeepeffect", on: ["kick"] },
        { handle: "thedeepeffect_", on: ["twitch", "youtube"] },
        { handle: "@thedeepeffect__", on: ["instagram"] },
      ];
      const SOCIAL_NAMES = {
        kick: "Kick",
        twitch: "Twitch",
        youtube: "YouTube",
        instagram: "Instagram",
      };

      function socialsFor(p, cls, style) {
        const s = p.socials,
          u = (s.size || 1) / scaleFor(p);
        return (
          `<div class="socials ${s.layout || "stack"} ${cls}" style="--u:${u.toFixed(4)};${style}">` +
          SOCIALS.map(
            (g, i) =>
              (s.layout === "pair" && i === 0 ? `<div class="soc-line">` : "") +
              `<div class="soc-row">` +
              g.on
                .map(
                  (n) =>
                    `<img class="cut" src="../../assets/socials/${n}.svg" alt="${SOCIAL_NAMES[n]}">`,
                )
                .join("") +
              `<span class="handle"><span>${g.handle}</span></span></div>` +
              (s.layout === "pair" && i === 1 ? `</div>` : ""),
          ).join("") +
          `</div>`
        );
      }

      /* ================================================================
   PANEL ART
   ================================================================ */
      function artFor(p) {
        switch (p.key) {
          case "start":
            return `
      <div class="rays"></div>
      <div class="scrawl">get comfy</div>
      <div class="big">STAND<br>BY</div>
      <div class="clock" id="countdown">05:00</div>`;
          case "chat":
            return `<div class="header">CHAT</div>`;
          case "game":
            return `
      <div class="burst"></div>
      <div class="strip">LIVE</div>
      <div class="chevrons"></div>`;
          case "cam":
            return `<div class="rays"></div>`;
          case "brb":
            /* Empty frame on purpose: the mascot browser source sits above
               this overlay in the vertical scene and paints into it. */
            return `
      <div class="big">BE RIGHT<br>BACK</div>
      <div class="mascot-frame"><span class="tape l"></span><span class="tape r"></span></div>
      <div class="bubble over" style="right:6%;top:22%;font-size:52px">back soon</div>`;
          case "end":
            return `
      <div class="big">MISSION<br>COMPLETE</div>
      <div class="stamp rank">S</div>
      <div class="credits"><ul>
        <li>thanks for watching</li><li>chat MVP — you</li>
        <li>mascot — the deer</li>
        <li>thanks for watching</li><li>chat MVP — you</li>
        <li>mascot — the deer</li>
      </ul></div>`;
          case "board":
            return `
      <div class="ink-circle"></div>
      <div class="title">INTEL</div>
      <div class="scrawl note">insider?</div>
      <div class="photo" style="left:64%;top:10%;width:24%;height:34%">?</div>
      <div class="photo" style="left:68%;top:56%;width:22%;height:30%">!</div>
      <svg viewBox="0 0 100 100" preserveAspectRatio="none">
        <path class="dash" d="M 54 46 L 74 70"/><path class="dash" d="M 52 28 L 68 24"/>
      </svg>`;
          case "np":
            return `
      <div class="np-label">NOW PLAYING</div>
      <div class="np-track">Untitled Sample — 120 BPM</div>
      <div class="eq">${"<i></i>".repeat(12)}</div>`;
          case "latest":
            return `
      <div class="title">LATEST</div>
      <div class="rows">
        <div class="row"><span>FOLLOW</span>—</div>
        <div class="row"><span>SUB</span>—</div>
        <div class="row"><span>TOP CHEER</span>—</div>
      </div>`;
          default:
            return "";
        }
      }

      /* ================================================================
   BUILD
   ================================================================ */
      /* frameEl, not `viewport` — CEF already defines window.viewport, which
         shadows id-based global lookup and yields a platform object with no
         getBoundingClientRect. */
      const frameEl = document.getElementById("viewport"),
        pageEl = document.getElementById("page"),
        panelEls = {},
        holeEls = [];

      ["skirt-n", "skirt-s", "skirt-w", "skirt-e"].forEach((c) => {
        const b = document.createElement("div");
        b.className = c;
        pageEl.appendChild(b);
      });

      const pageUnder = document.createElement("div");
      pageUnder.className = "page-under";
      pageEl.appendChild(pageUnder);

      PANELS.forEach((p) => {
        const el = document.createElement("div");
        el.className = `panel ${p.cls}`;
        el.dataset.id = p.id;
        Object.assign(el.style, {
          left: p.x + "px",
          top: p.y + "px",
          width: p.w + "px",
          height: p.h + "px",
          transform: `rotate(${p.rot}deg)`,
        });

        const holesHTML = (p.holes || [])
          .map(
            (h, i) =>
              `<div class="hole${h.bare ? " bare" : ""}" data-hole="${p.key}:${i}"
       style="left:${h.x}%;top:${h.y}%;width:${h.w}%;height:${h.h}%">
       <div class="fake-source" style="--src:${h.c}">
         <span class="src-label">${h.label}</span></div>
     </div>`,
          )
          .join("");

        /* Order is the whole trick: .under is masked, everything after it is
           not. Holes keep their inked borders, and speedlines and tag stay on
           top of the video. */
        const panelSocials =
          p.socials && !p.socials.page ? socialsFor(p, "over", p.socials.at) : "";
        el.innerHTML =
          `<div class="under">${artFor(p)}${panelSocials}` +
          (p.speedlines ? '<div class="speedlines"></div>' : "") +
          `</div>` +
          holesHTML +
          `<span class="panel-tag">${p.tag}</span>`;

        el.querySelectorAll(".under .over").forEach((n) => el.appendChild(n));

        pageEl.appendChild(el);
        panelEls[p.id] = el;
        /* Gutter-placed socials ride the page, outside every mask. */
        if (p.socials && p.socials.page)
          pageEl.insertAdjacentHTML(
            "beforeend",
            socialsFor(
              p,
              "",
              `left:${p.socials.page.x}px;top:${p.socials.page.y}px`,
            ),
          );
        (p.holes || []).forEach((h, i) =>
          holeEls.push({
            src: h.src,
            key: `${p.key}:${h.src}`,
            panelId: p.id,
            el: el.querySelector(`[data-hole="${p.key}:${i}"]`),
          }),
        );
      });

      /* The panel's own background moves into .under, or it paints behind the
         hole and no mask on .under can help. */
      PANELS.forEach((p) => {
        const el = panelEls[p.id],
          under = el.querySelector(".under");
        if (!under) return;
        const cs = getComputedStyle(el);
        Object.assign(under.style, {
          backgroundColor: cs.backgroundColor,
          backgroundImage: cs.backgroundImage,
          backgroundSize: cs.backgroundSize,
          backgroundPosition: cs.backgroundPosition,
          backgroundRepeat: cs.backgroundRepeat,
        });
        el.style.background = "none";
      });

      const PANEL_BORDER = 15; /* matches .panel border-width */

      (() => {
        const probe = pageEl.querySelector(".hole:not(.bare)");
        const HB = probe
          ? parseFloat(getComputedStyle(probe).borderTopWidth)
          : 11;
        let k = 0;
        PANELS.forEach((p) => {
          const cx = p.x + p.w / 2,
            cy = p.y + p.h / 2;
          const iw = p.w - 2 * PANEL_BORDER,
            ih = p.h - 2 * PANEL_BORDER;
          (p.holes || []).forEach((h) => {
            const b = h.bare ? 0 : HB;
            const lx = (iw * h.x) / 100,
              ly = (ih * h.y) / 100,
              lw = (iw * h.w) / 100,
              lh = (ih * h.h) / 100;
            Object.assign(holeEls[k++], {
              rot: p.rot,
              cx,
              cy,
              panelW: iw,
              panelH: ih,
              local: { x: lx + b, y: ly + b, w: lw - 2 * b, h: lh - 2 * b },
              page: {
                x: p.x + PANEL_BORDER + lx,
                y: p.y + PANEL_BORDER + ly,
                w: lw,
                h: lh,
              },
              pageInner: {
                x: p.x + PANEL_BORDER + lx + b,
                y: p.y + PANEL_BORDER + ly + b,
                w: lw - 2 * b,
                h: lh - 2 * b,
              },
            });
          });
        });
      })();

      /* ================================================================
   SAFE-ZONE PASS — measured off the built page, not modelled.

   §4's signature element is the panel tag, and it sat below the platform
   caption bar on five of six vertical scenes: game +297 canvas px, chat
   +269, end +119, brb +118, cam +17. The tag is authored once, in panel
   coordinates, at bottom: 32px — but every panel lands at its own fit
   scale, so no single number clears the line on all six, and six
   hand-tuned numbers rot the first time a panel moves.

   So it is read back off the page the way the punch sets are: apply each
   panel's resting transform, measure that panel's own tag, and raise it
   by exactly the overflow converted back into page px. The scale comes
   from scaleFor(), never from the measured rect — every panel is tilted,
   and a rotated AABB is taller than the box it encloses.

   Runs on document.fonts.ready: a Bangers tag measured against the
   fallback stack is the wrong height. Touches nothing the pan or the
   punch reads, so it is safe to land late.
   ================================================================ */
      function fitTagsToSafeArea() {
        const vpBox = frameEl.getBoundingClientRect();
        const prevTransform = pageEl.style.transform;
        const limit = CANVAS_H - SAFE_BOTTOM - SAFE_PAD;
        pageEl.style.transition = "none";

        PANELS.forEach((p) => {
          const tag = panelEls[p.id].querySelector(".panel-tag");
          if (!tag) return;
          pageEl.style.transform = transformFor(String(p.id));
          void pageEl.offsetWidth;
          const r = tag.getBoundingClientRect();
          const over = r.top - vpBox.top + r.height - limit;
          if (over <= 0) return;
          const base = parseFloat(getComputedStyle(tag).bottom) || 0;
          tag.style.bottom = base + over / scaleFor(p) + "px";
        });

        pageEl.style.transform = prevTransform;
        void pageEl.offsetWidth;
        pageEl.style.transition = "";
      }

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(fitTagsToSafeArea);
      } else {
        fitTagsToSafeArea();
      }

      /* Shared mutable state, declared up front — applyPunch() runs as soon as
         the first scene arrives, which can be before the sections below have
         been evaluated. */
      let ws = null,
        wsReady = false,
        reqId = 0,
        backoff = 1000,
        punched = new Set();
      const pendingReq = new Map();
      const itemIds = new Map(); /* sourceName -> sceneItemId */
      const srcSize = new Map(); /* sourceName -> {w, h} in source pixels */
      const itemOn = new Map(); /* sourceName -> enabled, as OBS last reported */
      const managed = new Set(holeEls.map((h) => h.src));

      /* The browser stands in for the game while it is UNMUTED, exactly as on
         the horizontal page — same input, same mute, so one switch moves both
         canvases. Not in `managed`: a VCOMIC without Browser is complete, so
         its absence must not keep the rebind loop below spinning. */
      const BROWSER = "Browser";
      let browserLive = false;
      const feed = (src) =>
        src === "Game" && browserLive && itemIds.has(BROWSER) ? BROWSER : src;

      /* ================================================================
   HOLE PUNCH — masks generated from the same PANELS config.

   Identical to the horizontal page: one path per mask, fill-rule
   evenodd, only each hole's content box cut so borders and shadows
   survive by construction. See CLAUDE.md §2 for the four ways to get
   this silently wrong.
   ================================================================ */
      const rotPt = (px, py, cx, cy, deg) => {
        const a = (deg * Math.PI) / 180,
          c = Math.cos(a),
          s = Math.sin(a),
          dx = px - cx,
          dy = py - cy;
        return [cx + dx * c - dy * s, cy + dx * s + dy * c];
      };

      const quad = (x, y, w, h, cx, cy, deg) =>
        "M" +
        [
          [x, y],
          [x + w, y],
          [x + w, y + h],
          [x, y + h],
        ]
          .map(([px, py]) =>
            rotPt(px, py, cx, cy, deg)
              .map((n) => n.toFixed(1))
              .join(" "),
          )
          .join("L") +
        "Z";

      function applyMask(el, X, Y, W, H, cuts) {
        const d = `M${X} ${Y}H${X + W}V${Y + H}H${X}Z` + cuts;
        const svg =
          `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" ` +
          `viewBox="${X} ${Y} ${W} ${H}">` +
          `<path fill="#000" fill-rule="evenodd" d="${d}"/></svg>`;
        const uri = `url("data:image/svg+xml;utf8,${encodeURIComponent(svg)}")`;
        Object.assign(el.style, {
          maskImage: uri,
          webkitMaskImage: uri,
          maskSize: `${W}px ${H}px`,
          webkitMaskSize: `${W}px ${H}px`,
          maskPosition: `${X}px ${Y}px`,
          webkitMaskPosition: `${X}px ${Y}px`,
          maskRepeat: "no-repeat",
          webkitMaskRepeat: "no-repeat",
          maskClip: "no-clip",
          webkitMaskClip: "no-clip",
        });
      }

      function pageCorners(r, cx, cy, deg) {
        return [
          [r.x, r.y],
          [r.x + r.w, r.y],
          [r.x + r.w, r.y + r.h],
          [r.x, r.y + r.h],
        ].map(([x, y]) => rotPt(x, y, cx, cy, deg));
      }

      function restingRects(id) {
        const m = new DOMMatrix(transformFor(String(id)));
        return holeEls.map((h) => {
          const pts = pageCorners(h.page, h.cx, h.cy, h.rot).map(([x, y]) =>
            m.transformPoint(new DOMPoint(x, y)),
          );
          const xs = pts.map((q) => q.x),
            ys = pts.map((q) => q.y);
          const x = Math.min(...xs),
            y = Math.min(...ys);
          const w = Math.max(...xs) - x,
            hh = Math.max(...ys) - y;
          const vx = Math.max(0, Math.min(CANVAS_W, x + w) - Math.max(0, x));
          const vy = Math.max(0, Math.min(CANVAS_H, y + hh) - Math.max(0, y));
          return { hole: h, onScreen: vx * vy };
        });
      }

      /* One OBS item per source in the vertical scene, so a source can only be
         in one hole at a time — Cam is referenced by four panels here too. The
         panel on air wins; failing that, whichever on-screen hole shows the
         most of itself takes it. */
      function chooseWinners(id) {
        const best = new Map();
        restingRects(id).forEach((r) => {
          if (!r.onScreen) return;
          const live = r.hole.panelId === id;
          const cur = best.get(r.hole.src);
          if (
            !cur ||
            (live && !cur.live) ||
            (live === cur.live && r.onScreen > cur.onScreen)
          )
            best.set(r.hole.src, { hole: r.hole, live, onScreen: r.onScreen });
        });
        return new Set([...best.values()].map((v) => v.hole));
      }

      const contains = (a, b) =>
        b.x >= a.x &&
        b.y >= a.y &&
        b.x + b.w <= a.x + a.w &&
        b.y + b.h <= a.y + a.h;

      /* No hole on this page nests inside another — the game panel's two
         windows are stacked, not concentric — so this should find nothing to
         drop. Kept because evenodd would flip a contained cut back to opaque
         in silence, and a future panel could reintroduce one. */
      function mergeCuts(holes) {
        const kept = holes.filter(
          (h) => !holes.some((g) => g !== h && contains(g.local, h.local)),
        );
        if (DEBUG)
          kept.forEach((h, i) =>
            kept.slice(i + 1).forEach((g) => {
              const o =
                h.local.x < g.local.x + g.local.w &&
                g.local.x < h.local.x + h.local.w &&
                h.local.y < g.local.y + g.local.h &&
                g.local.y < h.local.y + h.local.h;
              if (o) hud(`cuts overlap: ${h.key} / ${g.key}`, true);
            }),
          );
        return kept;
      }

      function applyPunch(id) {
        punched = id >= 0 ? chooseWinners(id) : new Set();
        holeEls.forEach((h) =>
          h.el.classList.toggle("punched", punched.has(h)),
        );

        let pageCuts = "";
        PANELS.forEach((p) => {
          const under = panelEls[p.id].querySelector(".under");
          if (!under) return;
          const mine = mergeCuts(
            holeEls.filter((h) => h.panelId === p.id && punched.has(h)),
          );
          if (!mine.length) {
            under.style.maskImage = "none";
            under.style.webkitMaskImage = "none";
            return;
          }
          let panelCuts = "";
          mine.forEach((h) => {
            panelCuts += quad(
              h.local.x,
              h.local.y,
              h.local.w,
              h.local.h,
              0,
              0,
              0,
            );
            pageCuts += quad(
              h.pageInner.x,
              h.pageInner.y,
              h.pageInner.w,
              h.pageInner.h,
              h.cx,
              h.cy,
              h.rot,
            );
          });
          applyMask(under, 0, 0, mine[0].panelW, mine[0].panelH, panelCuts);
        });

        applyMask(pageUnder, 0, 0, PAGE_W, PAGE_H, pageCuts);
        syncVisibility();
      }
      applyPunch(-1); /* nothing live yet — page fully opaque */

      /* Countdown on the standby panel */
      let secs = 300;
      setInterval(() => {
        const c = document.getElementById("countdown");
        if (!c) return;
        secs = secs > 0 ? secs - 1 : 300;
        c.textContent = `${String(Math.floor(secs / 60)).padStart(2, "0")}:${String(secs % 60).padStart(2, "0")}`;
      }, 1000);

      /* ================================================================
   PAN MATH
     translate(viewport centre)
     rotate(-panel tilt)      -> panel squares up to the frame
     scale(fit)
     translate(-panel centre)
   ================================================================ */
      let current = null;
      /* The panel's resting scale. Shared with fitTagsToSafeArea(), which
         must not measure it off a rendered rect — getBoundingClientRect
         returns a rotated AABB, and every panel here is tilted. */
      function scaleFor(p) {
        const sx = CANVAS_W / p.w,
          sy = CANVAS_H / p.h;
        return p.fit === "fill" ? Math.max(sx, sy) : Math.min(sx, sy) * 0.97;
      }
      function transformFor(t) {
        if (t === "page") {
          const s = Math.min(CANVAS_W / PAGE_W, CANVAS_H / PAGE_H) * 0.94;
          return `translate(${CANVAS_W / 2}px,${CANVAS_H / 2}px) scale(${s}) translate(${-PAGE_W / 2}px,${-PAGE_H / 2}px)`;
        }
        const p = PANELS.find((v) => v.id === Number(t));
        const s = scaleFor(p);
        const cx = p.x + p.w / 2,
          cy = p.y + p.h / 2;
        return `translate(${CANVAS_W / 2}px,${CANVAS_H / 2}px) rotate(${-p.rot}deg) scale(${s}) translate(${-cx}px,${-cy}px)`;
      }

      const shaker = document.getElementById("shaker");
      let shakeTimer;

      const PAN_MS = parseFloat(
        getComputedStyle(document.documentElement).getPropertyValue("--pan-ms"),
      );

      function goTo(t, { instant = false } = {}) {
        current = t;
        applyPunch(Number(t));
        Object.entries(panelEls).forEach(([id, el]) =>
          el.classList.toggle("is-live", id === String(t)),
        );

        clearTimeout(shakeTimer);

        if (instant) {
          pageEl.style.transition = "none";
          pageEl.style.transform = transformFor(t);
          void pageEl.offsetWidth;
          pageEl.style.transition = "";
          startTracking(120);
          return;
        }

        pageEl.style.transform = transformFor(t);
        startTracking(PAN_MS + 260);

        shakeTimer = setTimeout(() => {
          shaker.classList.remove("shake");
          void shaker.offsetWidth;
          shaker.classList.add("shake");
        }, 810);
      }

      /* ================================================================
   HOLE RECTS — one row per hole, already in vertical-canvas coordinates.
   ================================================================ */
      function holeRects() {
        const vp = frameEl.getBoundingClientRect();
        return holeEls.map((h) => {
          const r = h.el.getBoundingClientRect();
          const x = r.left - vp.left,
            y = r.top - vp.top;
          return {
            hole: h,
            src: h.src,
            key: h.key,
            x,
            y,
            w: r.width,
            h: r.height,
            visible:
              x < CANVAS_W &&
              y < CANVAS_H &&
              x + r.width > 0 &&
              y + r.height > 0,
          };
        });
      }

      let trackRAF = 0,
        trackUntil = 0;

      function track() {
        const rects = holeRects();
        if (DEBUG) paintRects(rects);
        pushRects(rects);
        if (performance.now() < trackUntil)
          trackRAF = requestAnimationFrame(track);
        else trackRAF = 0;
      }

      function startTracking(ms) {
        trackUntil = Math.max(trackUntil, performance.now() + ms);
        if (!trackRAF) track();
      }

      /* ================================================================
   OBS WIRING — vertical canvas

   Two differences from the horizontal overlay, and both matter.

   1. SCENE SOURCE. The websocket is PRIMARY here, not the backup.
      window.obsstudio's behaviour inside an Aitum canvas is unmeasured,
      and what this page needs is the MAIN canvas's program scene so one
      Stream Deck press moves both pages. CurrentProgramSceneChanged
      carries exactly that. obsstudio is still wired up underneath: if it
      reports a vertical scene name it simply isn't in SCENE_MAP and is
      ignored, so it costs nothing and covers us if it does report the
      trigger scene.

   2. TRANSFORM TARGET. Every scene request goes to the vertical canvas
      by sceneUuid. Measured on OBS 32.2.2 / obs-websocket 5.7.4:
      canvasName is SILENTLY IGNORED — GetSceneList {canvasName: "Aitum
      Vertical"} returns Main's scene list with no error — and vertical
      scenes cannot be reached by sceneName at all, because name lookup
      resolves within Main only. So the uuid is discovered from
      GetCanvasList on every connect and never cached to disk; it is
      random per scene collection. See CLAUDE.md §2.
   ================================================================ */
      /* Scenes UPPERCASE, sources TitleCase — OBS shares one namespace across
         canvases too, so the vertical scene cannot be called COMIC. */
      const VERT_SCENE = params.get("scene") || "VCOMIC";
      /* Which canvas to drive. Default is "the one that isn't Main"; naming it
         matters only if you ever run more than one extra canvas. */
      const VERT_CANVAS = params.get("canvas") || "";

      const SCENE_MAP = {
        START: 1,
        CHAT: 2,
        GAME: 3,
        CAM: 4,
        BRB: 5,
        END: 6,
      };

      let vertCanvasUuid = null,
        vertSceneUuid = null,
        currentScene = null,
        seeded = false;

      function applyScene(name, via) {
        if (!name) return;

        const id = SCENE_MAP[name];
        if (!id) return hud(`${via}: ${name} — not a mapped scene, ignored`);

        /* Both paths can report the same switch a few ms apart. First wins;
           the second is a no-op rather than a second pan. */
        if (name === currentScene) return;

        currentScene = name;
        const first = !seeded;
        seeded = true;
        goTo(String(id), { instant: first });
        syncVisibility();
        /* Re-read sizes: the crop that makes a source fill its opening depends
           on them, and a capture can change resolution at any time. */
        if (wsReady && vertSceneUuid) loadItemIds({ quiet: true });
        hud(`${via}: ${name} → panel ${id}${first ? " (seed)" : ""}`);
      }

      /* --- path A (secondary): window.obsstudio ------------------------ */
      window.addEventListener("obsSceneChanged", (e) =>
        applyScene(e.detail && e.detail.name, "obsstudio"),
      );

      /* --- path B (primary): obs-websocket v5 -------------------------- */
      const K = [
        0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1,
        0x923f82a4, 0xab1c5ed5, 0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3,
        0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174, 0xe49b69c1, 0xefbe4786,
        0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
        0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147,
        0x06ca6351, 0x14292967, 0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13,
        0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85, 0xa2bfe8a1, 0xa81a664b,
        0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
        0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a,
        0x5b9cca4f, 0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208,
        0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2,
      ];
      const rotr = (x, n) => ((x >>> n) | (x << (32 - n))) >>> 0;

      /* Hand-rolled because crypto.subtle needs a secure context and this page
         is loaded from file:// inside CEF. */
      function sha256(bytes) {
        const len = bytes.length;
        const buf = new Uint8Array(((len + 9 + 63) >> 6) << 6);
        buf.set(bytes);
        buf[len] = 0x80;
        const dv = new DataView(buf.buffer);
        dv.setUint32(buf.length - 4, len << 3, false);
        dv.setUint32(buf.length - 8, Math.floor((len * 8) / 0x100000000), false);
        let H = [
          0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f,
          0x9b05688c, 0x1f83d9ab, 0x5be0cd19,
        ];
        const w = new Uint32Array(64);
        for (let i = 0; i < buf.length; i += 64) {
          for (let t = 0; t < 16; t++) w[t] = dv.getUint32(i + t * 4, false);
          for (let t = 16; t < 64; t++) {
            const s0 =
              rotr(w[t - 15], 7) ^ rotr(w[t - 15], 18) ^ (w[t - 15] >>> 3);
            const s1 =
              rotr(w[t - 2], 17) ^ rotr(w[t - 2], 19) ^ (w[t - 2] >>> 10);
            w[t] = (w[t - 16] + s0 + w[t - 7] + s1) >>> 0;
          }
          let [a, b, c, d, e, f, g, h] = H;
          for (let t = 0; t < 64; t++) {
            const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
            const ch = (e & f) ^ (~e & g);
            const t1 = (h + S1 + ch + K[t] + w[t]) >>> 0;
            const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
            const mj = (a & b) ^ (a & c) ^ (b & c);
            const t2 = (S0 + mj) >>> 0;
            h = g;
            g = f;
            f = e;
            e = (d + t1) >>> 0;
            d = c;
            c = b;
            b = a;
            a = (t1 + t2) >>> 0;
          }
          H = H.map((v, j) => (v + [a, b, c, d, e, f, g, h][j]) >>> 0);
        }
        const out = new Uint8Array(32);
        const odv = new DataView(out.buffer);
        H.forEach((v, i) => odv.setUint32(i * 4, v, false));
        return out;
      }

      const utf8 = (str) => new TextEncoder().encode(str);
      const b64 = (bytes) => btoa(String.fromCharCode(...bytes));
      const catBytes = (a, b) => {
        const r = new Uint8Array(a.length + b.length);
        r.set(a);
        r.set(b, a.length);
        return r;
      };
      const authString = (pw, salt, challenge) =>
        b64(
          sha256(catBytes(utf8(b64(sha256(utf8(pw + salt)))), utf8(challenge))),
        );

      const WS_URL = params.get("host") || "ws://127.0.0.1:4455";
      const WS_PW = params.get("pw") || "";

      function request(type, data) {
        return new Promise((resolve, reject) => {
          if (!wsReady) return reject(new Error("not identified"));
          const id = "r" + ++reqId;
          pendingReq.set(id, { resolve, reject });
          ws.send(
            JSON.stringify({
              op: 6,
              d: { requestType: type, requestId: id, requestData: data || {} },
            }),
          );
        });
      }

      /* Find the vertical canvas and the scene this overlay lives in, then
         bind the source items inside it. Retried on a timer rather than given
         up on: OBS can identify the websocket before the Aitum canvas or its
         scene exist — a fresh install, or a collection being set up — and the
         page should heal when they appear rather than needing a reload. */
      let resolveTimer = 0;
      function resolveVerticalScene() {
        clearTimeout(resolveTimer);
        if (!wsReady) return;
        request("GetCanvasList")
          .then((r) => {
            const cs = r.canvases || [];
            const pick = VERT_CANVAS
              ? cs.find((c) => c.canvasName === VERT_CANVAS)
              : cs.find(
                  /* A canvas outlives the plugin that drove it — it is saved
                     in the scene collection — and an orphan reports a null
                     base size. Skip it, or the pick lands on a dead canvas. */
                  (c) =>
                    !(c.canvasFlags && c.canvasFlags.MAIN) &&
                    c.canvasVideoSettings &&
                    c.canvasVideoSettings.baseWidth,
                );
            if (!pick)
              throw new Error(
                VERT_CANVAS
                  ? `no canvas named ${VERT_CANVAS}`
                  : "no non-Main canvas — is the vertical canvas added?",
              );
            vertCanvasUuid = pick.canvasUuid;
            hud(`canvas: ${pick.canvasName}`);
            /* canvasUuid, never canvasName — the name is silently ignored and
               would hand back Main's scenes. */
            return request("GetSceneList", { canvasUuid: vertCanvasUuid });
          })
          .then((r) => {
            const sc = (r.scenes || []).find((s) => s.sceneName === VERT_SCENE);
            if (!sc)
              throw new Error(
                `no scene ${VERT_SCENE} on the vertical canvas — run ` +
                  `tools/obs-setup.py --vertical`,
              );
            vertSceneUuid = sc.sceneUuid;
            hud(`scene: ${VERT_SCENE}`);
            loadItemIds();
          })
          .catch((e) => {
            vertSceneUuid = null;
            hud(`vertical: ${e.message}`, true);
            resolveTimer = setTimeout(resolveVerticalScene, 4000);
          });
      }

      function connect() {
        try {
          ws = new WebSocket(WS_URL);
        } catch (_) {
          return scheduleReconnect();
        }

        ws.onclose = () => {
          wsReady = false;
          vertSceneUuid = null;
          pendingReq.clear();
          hud("websocket: closed", true);
          scheduleReconnect();
        };
        ws.onerror = () => {}; /* onclose always follows; handle it there */

        ws.onmessage = (ev) => {
          const msg = JSON.parse(ev.data);

          if (msg.op === 0) {
            /* General | Scenes | Inputs — Inputs for Browser's mute. */
            const d = { rpcVersion: 1, eventSubscriptions: 1 | 4 | 8 };
            if (msg.d.authentication) {
              if (!WS_PW) {
                hud("websocket: server wants a password, none given", true);
                return ws.close();
              }
              d.authentication = authString(
                WS_PW,
                msg.d.authentication.salt,
                msg.d.authentication.challenge,
              );
            }
            ws.send(JSON.stringify({ op: 1, d }));
            return;
          }

          if (msg.op === 2) {
            wsReady = true;
            backoff = 1000;
            hud("websocket: identified");
            /* No canvasUuid: this is the MAIN canvas's program scene, which is
               what drives the pan. */
            request("GetSceneList")
              .then((r) =>
                applyScene(r.currentProgramSceneName, "websocket/seed"),
              )
              .catch(() => {});
            resolveVerticalScene();
            request("GetInputMute", { inputName: BROWSER })
              .then((r) => setBrowserLive(!r.inputMuted))
              .catch(() => setBrowserLive(false));
            return;
          }

          if (msg.op === 5) {
            const e = msg.d.eventData || {};
            if (msg.d.eventType === "CurrentProgramSceneChanged")
              applyScene(e.sceneName, "websocket");
            else if (e.inputName === BROWSER) {
              if (msg.d.eventType === "InputMuteStateChanged")
                setBrowserLive(!e.inputMuted);
              else if (msg.d.eventType === "InputRemoved") setBrowserLive(false);
            }
            return;
          }

          if (msg.op === 9) return; /* RequestBatchResponse — fire and forget */

          if (msg.op === 7) {
            const pr = pendingReq.get(msg.d.requestId);
            if (!pr) return;
            pendingReq.delete(msg.d.requestId);
            if (msg.d.requestStatus.result)
              pr.resolve(msg.d.responseData || {});
            else pr.reject(new Error(msg.d.requestStatus.comment || "failed"));
          }
        };
      }

      function scheduleReconnect() {
        setTimeout(connect, backoff);
        backoff = Math.min(backoff * 2, 8000);
      }

      connect();

      /* ================================================================
   SOURCE PLACEMENT

   Same rules as the horizontal page, addressed by sceneUuid instead of
   sceneName. These are DIFFERENT scene items from COMIC's, referencing
   the same inputs, so the two overlays cannot fight over a transform —
   verified on OBS 32.2.2.
   ================================================================ */
      function loadItemIds({ quiet = false } = {}) {
        if (!vertSceneUuid) return;
        request("GetSceneItemList", { sceneUuid: vertSceneUuid })
          .then((r) => {
            itemIds.clear();
            itemOn.clear();
            r.sceneItems.forEach((i) => {
              itemIds.set(i.sourceName, i.sceneItemId);
              itemOn.set(i.sourceName, i.sceneItemEnabled !== false);
              /* A source that has not produced a frame yet reports 0 — left
                 out so fillTransform falls back until it has. */
              const t = i.sceneItemTransform || {};
              if (t.sourceWidth > 0 && t.sourceHeight > 0)
                srcSize.set(i.sourceName, {
                  w: t.sourceWidth,
                  h: t.sourceHeight,
                });
            });
            const missing = [...managed].filter((n) => !itemIds.has(n));
            if (missing.length || !quiet)
              hud(
                missing.length
                  ? `sources missing from ${VERT_SCENE}: ${missing.join(", ")}`
                  : `sources bound: ${[...managed].join(", ")}`,
                missing.length > 0,
              );
            /* Rebind if the scene is not fully populated yet. The horizontal
               overlay can assume COMIC is complete before it loads, because
               COMIC is on program the moment OBS starts. This page cannot:
               obs-setup --vertical creates OverlayV as the FIRST item in a new
               VCOMIC and adds Game / Cam / Chat after it, so a boot in that
               window binds an item list with none of them in it — and without
               this, nothing would rebind until the next scene change, leaving
               the vertical canvas showing comic art over empty holes. */
            if (missing.length)
              setTimeout(() => loadItemIds({ quiet: true }), 3000);
            syncVisibility();
            startTracking(120); /* place them once, without waiting for a pan */
          })
          .catch(() => {
            hud(`cannot read ${VERT_SCENE} item list`, true);
            /* The scene was renamed or removed under us. Re-resolve. */
            vertSceneUuid = null;
            resolveTimer = setTimeout(resolveVerticalScene, 4000);
          });
      }

      /* No pan: the same hole changes feed. Re-read the item list so a
         Browser added after boot binds, with the size its crop needs. */
      function setBrowserLive(live) {
        if (live === browserLive) return;
        browserLive = live;
        hud(`browser ${live ? "on air" : "off air"}`);
        if (wsReady) loadItemIds({ quiet: true });
      }

      function sendBatch(requests) {
        ws.send(
          JSON.stringify({
            op: 8,
            d: {
              requestId: "b" + ++reqId,
              haltOnFailure: false,
              executionType: 0,
              requests,
            },
          }),
        );
      }

      /* Crop to the opening's aspect, then stretch. SCALE_OUTER fits without
         distorting but spills the excess past the bounds box, and spill that
         lands in ANOTHER punched hole is not something a mask can hide. */
      function fillTransform(r, s) {
        const t = {
          positionX: r.x,
          positionY: r.y,
          alignment: 5 /* top-left, so position IS the rect corner */,
          rotation: 0,
          boundsAlignment: 0,
          boundsWidth: Math.max(1, r.w),
          boundsHeight: Math.max(1, r.h),
        };

        if (!s) {
          t.boundsType = "OBS_BOUNDS_SCALE_OUTER";
          /* A crop left over from when this source DID have a size would still
             apply, and SCALE_OUTER would fit the cropped frame. */
          t.cropLeft = t.cropRight = t.cropTop = t.cropBottom = 0;
          return t;
        }

        const want = Math.max(1, r.w) / Math.max(1, r.h);
        let cx = 0,
          cy = 0;
        if (s.w / s.h > want) cx = Math.round((s.w - s.h * want) / 2);
        else cy = Math.round((s.h - s.w / want) / 2);

        /* OBS rejects a crop that leaves nothing, and a 1px rounding error at
           an extreme aspect would do exactly that. */
        cx = Math.min(cx, Math.floor((s.w - 2) / 2));
        cy = Math.min(cy, Math.floor((s.h - 2) / 2));

        t.boundsType = "OBS_BOUNDS_STRETCH";
        t.cropLeft = t.cropRight = Math.max(0, cx);
        t.cropTop = t.cropBottom = Math.max(0, cy);
        return t;
      }

      function pushRects(rects) {
        if (!wsReady || !vertSceneUuid || !itemIds.size) return;
        const reqs = [];
        rects.forEach((r) => {
          if (!punched.has(r.hole)) return;
          const src = feed(r.src);
          const id = itemIds.get(src);
          if (!id) return;
          reqs.push({
            requestType: "SetSceneItemTransform",
            requestData: {
              sceneUuid: vertSceneUuid,
              sceneItemId: id,
              sceneItemTransform: fillTransform(r, srcSize.get(src)),
            },
          });
        });
        if (reqs.length) sendBatch(reqs);
      }

      /* Sources the live panel does not use are parked wholly outside the
         canvas, not switched off — disabling deactivates the source and coming
         back costs a capture re-hook. CLAUDE.md §2. */
      const PARK = {
        positionX: CANVAS_W + 200,
        positionY: CANVAS_H + 200,
        alignment: 5,
        rotation: 0,
        boundsType: "OBS_BOUNDS_STRETCH",
        boundsAlignment: 0,
        boundsWidth: 16,
        boundsHeight: 9,
      };

      function syncVisibility() {
        if (!wsReady || !vertSceneUuid || !itemIds.size) return;
        const used = new Set([...punched].map((h) => feed(h.src)));
        const reqs = [];
        itemIds.forEach((id, name) => {
          if (!managed.has(name) && name !== BROWSER) return;
          if (itemOn.get(name) === false) {
            reqs.push({
              requestType: "SetSceneItemEnabled",
              requestData: {
                sceneUuid: vertSceneUuid,
                sceneItemId: id,
                sceneItemEnabled: true,
              },
            });
            itemOn.set(name, true);
          }
          if (!used.has(name))
            reqs.push({
              requestType: "SetSceneItemTransform",
              requestData: {
                sceneUuid: vertSceneUuid,
                sceneItemId: id,
                sceneItemTransform: PARK,
              },
            });
        });
        if (reqs.length) sendBatch(reqs);
      }

      /* ================================================================
   DEBUG HUD — ?debug=1
   ================================================================ */
      const hudEl = document.getElementById("hud"),
        hudState = document.getElementById("hudState"),
        hudRects = document.getElementById("hudRects"),
        hudLog = document.getElementById("hudLog");
      const hudLines = [];

      function hud(msg, warn) {
        if (!DEBUG) return;
        const t = new Date().toTimeString().slice(0, 8);
        hudLines.push(
          `<span class="${warn ? "warn" : ""}">${t}  ${msg}</span>`,
        );
        while (hudLines.length > 8) hudLines.shift();
        hudLog.innerHTML = hudLines.join("\n");
        paintState();
      }

      function paintState() {
        hudState.textContent =
          `scene   ${currentScene || "—"}\n` +
          `panel   ${current || "—"}\n` +
          `socket  ${wsReady ? "identified" : "down"}\n` +
          `canvas  ${vertCanvasUuid ? vertCanvasUuid.slice(0, 8) : "—"}\n` +
          `vscene  ${vertSceneUuid ? VERT_SCENE : "unresolved"}\n` +
          `items   ${itemIds.size ? [...itemIds.keys()].join(" ") : "—"}\n` +
          `obsapi  ${window.obsstudio ? "present" : "absent"}\n`;
      }

      function paintRects(rects) {
        hudRects.innerHTML =
          "\n" +
          rects
            .map(
              (r) =>
                `<span class="${r.visible ? "" : "off"}">` +
                `${r.key.padEnd(12)}` +
                `x:${r.x.toFixed(0).padStart(6)} y:${r.y.toFixed(0).padStart(6)} ` +
                `w:${r.w.toFixed(0).padStart(5)} h:${r.h.toFixed(0).padStart(5)} ` +
                `${r.visible ? "SEND" : "skip"}</span>`,
            )
            .join("\n") +
          "\n";
      }

      if (DEBUG) {
        hudEl.removeAttribute("hidden");
        paintState();
        hud(`vertical up — ${window.obsstudio ? "inside OBS" : "browser"}`);
        /* Keys 1-9 for testing outside OBS. There is no keyboard in a browser
           source, so this is dead weight on a live overlay. */
        document.addEventListener("keydown", (e) => {
          const n = Number(e.key);
          if (n >= 1 && n <= PANELS.length) goTo(String(n));
        });
      }
    </script>
  </body>
</html>
