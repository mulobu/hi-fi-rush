<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Comic Page Overlay — OBS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bangers&family=Permanent+Marker&family=Caveat:wght@600;700&family=Baloo+2:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ============================================================
   TOKENS
   ============================================================ */
      :root {
        --ink: #16161d;
        --gutter: #aebcc9;
        --yellow: #f5d030;
        --marker: #d93028;
        --peri: #b9c3d6;
        --navy: #3b4a9e;
        --cyan: #35d6e8;
        --paper: #f4f1e8;
        --mint: #3fb98a;
        --plum: #6b3f8f;

        --canvas-w: 1920px;
        --canvas-h: 1080px;
        --page-w: 7680px;
        --page-h: 4320px;
        /* How far the gutter overhangs the page. It must exceed the worst
           bleed DURING a pan, not at rest. Resting worst is chat at 1672 page
           px, which is what the old 2000 was sized for, and it was wrong: a
           transition interpolates the transform components independently, so
           the camera passes through views wider than either endpoint, and the
           overshoot easing carries it ~4.8% past the target on top of that.
           Stepping every ordered pair through the real easing peaks at
           cam -> chat, 2187 page px at 550ms in — 187 past the old skirt, a
           54px band of bare canvas along the frame edge on every switch into
           CHAT. 2500 clears every pan; 3000 is headroom, and a whole number
           of 30px halftone tiles so the skirt's dots stay in phase with the
           page's. */
        --page-skirt: 3000px;

        --beat-ms: 500ms;
        --pan-ms: 980ms;
        --snap: cubic-bezier(0.32, 1.38, 0.48, 1);

        --f-display: "Bangers", "Arial Black", sans-serif;
        --f-marker: "Permanent Marker", cursive;
        --f-scrawl: "Caveat", cursive;
        --f-body: "Baloo 2", system-ui, sans-serif;

        --wobble: 240px 18px 200px 22px / 20px 210px 24px 230px;
        --wobble-sm: 80px 8px 70px 10px / 9px 74px 11px 78px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        /* Transparent, so a dead browser source degrades to whatever OBS
           has behind it rather than a white box. See CLAUDE.md §6. */
        background: transparent;
        font-family: var(--f-body);
        color: var(--paper);
        overflow: hidden;
        width: var(--canvas-w);
        height: var(--canvas-h);
      }

      /* ============================================================
   FRAME — the viewport IS the OBS canvas.

   Nothing scales it. 1px here is 1px in OBS, which is the whole
   reason getBoundingClientRect() can be handed straight to
   SetSceneItemTransform with no conversion.
   ============================================================ */
      .viewport {
        position: fixed;
        top: 0;
        left: 0;
        width: var(--canvas-w);
        height: var(--canvas-h);
        overflow: hidden;
        /* Transparent: the punched holes must reach OBS, not stop here. The
           gutter this used to paint is now the skirt on .page below, which
           keeps the same colour but sits inside the mask. */
        background: transparent;
      }
      .shaker {
        position: absolute;
        inset: 0;
      }
      .shaker.shake {
        animation: shake 180ms steps(3, end);
      }
      @keyframes shake {
        0% {
          transform: translate(0, 0);
        }
        30% {
          transform: translate(-9px, 6px);
        }
        60% {
          transform: translate(7px, -7px);
        }
        100% {
          transform: translate(0, 0);
        }
      }

      .page {
        position: absolute;
        top: 0;
        left: 0;
        width: var(--page-w);
        height: var(--page-h);
        transform-origin: 0 0;
        transition: transform var(--pan-ms) var(--snap);
        will-change: transform;
        /* Deliberately paints nothing. A mask applies to the whole subtree, so
           anything painted here could only be cut by punching holes through
           every panel, tag and border as well. .page-under carries the paint
           instead, as a sibling of the panels rather than their ancestor. */
      }
      /* Gutter and halftone, in five elements that look like one surface.

         .page-under is the page itself and carries the cuts. The skirt — the
         overhang that makes a fitted panel show gutter past the page edge
         rather than webcam — is four bands AROUND that rectangle: top, bottom,
         left, right. They meet its edges and never lie over it.

         The band that must not exist is a single inset rectangle. It would
         cover the page as well as the overhang, and being unmasked it would
         seal every cut in .page-under back up: no video, anywhere. The reason
         to split at all is that only the page can contain a cut, so only the
         page needs a mask — and a mask forces its own composited layer, so
         one inset element would have put 13680 x 10320, 4x the page's area,
         through the compositor on every frame of a pan.

         Phase: the halftone tiles at 30px, and the page (7680 x 4320) and the
         skirt (3000) are all whole numbers of tiles, so every band's origin
         lands on the same grid as the page's and the seams are invisible. */
      .skirt-n,
      .skirt-s,
      .skirt-w,
      .skirt-e {
        position: absolute;
        background: var(--gutter);
      }
      .skirt-n,
      .skirt-s {
        left: calc(-1 * var(--page-skirt));
        right: calc(-1 * var(--page-skirt));
        height: var(--page-skirt);
      }
      .skirt-n {
        top: calc(-1 * var(--page-skirt));
      }
      .skirt-s {
        top: 100%;
      }
      .skirt-w,
      .skirt-e {
        top: 0;
        height: var(--page-h);
        width: var(--page-skirt);
      }
      .skirt-w {
        left: calc(-1 * var(--page-skirt));
      }
      .skirt-e {
        left: 100%;
      }
      .page-under {
        position: absolute;
        inset: 0;
        background: var(--gutter);
      }
      .skirt-n::before,
      .skirt-s::before,
      .skirt-w::before,
      .skirt-e::before,
      .page-under::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: radial-gradient(var(--ink) 32%, transparent 33%);
        background-size: 30px 30px;
        opacity: 0.1;
      }

      /* ============================================================
   PANELS
   ============================================================ */
      .panel {
        position: absolute;
        overflow: hidden;
        cursor: pointer;
        border: 15px solid var(--ink);
        border-radius: var(--wobble);
        box-shadow: 22px 22px 0 rgba(22, 22, 29, 0.55);
      }
      /* On .under, not .panel: .panel is never masked, so a halftone there
         would tile straight over the live video inside every hole. Same box
         either way — .under fills the panel's padding box. */
      .under::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: radial-gradient(
          rgba(22, 22, 29, 0.85) 30%,
          transparent 31%
        );
        background-size: 26px 26px;
        opacity: 0.18;
        mix-blend-mode: multiply;
      }

      /* HOLES — transparent windows. One OBS source sits behind each. */
      .hole {
        position: absolute;
        background: transparent;
        overflow: hidden;
        border: 11px solid var(--ink);
        border-radius: var(--wobble-sm);
        box-shadow: 12px 12px 0 rgba(22, 22, 29, 0.6);
      }
      .hole.bare {
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
      /* Everything that sits BENEATH the holes. The only masked part of a
         panel — see HOLE PUNCH. Carries the panel's background, moved off
         .panel at build time so the panel itself paints nothing behind a
         hole. */
      .under {
        position: absolute;
        inset: 0;
      }
      /* What a hole shows when it could not claim its source — which is the
         normal state for every neighbouring panel bleeding into frame, not an
         error. Translucent on purpose: an unpunched hole is not masked, so the
         panel's own art is still behind it and this shades that art into a
         drawn window instead of covering it with a mud-coloured box. */
      .fake-source {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: repeating-linear-gradient(
          45deg,
          rgba(22, 22, 29, 0.34) 0 40px,
          rgba(22, 22, 29, 0.14) 40px 80px
        );
      }
      /* The source name is scaffolding for the mockup. On air it is a word
         printed across the art in a panel nobody is looking at. */
      .src-label {
        display: none;
      }
      /* A punched hole is a real window. Any hole that could not claim its
         source keeps the drawn placeholder, so it reads as comic art rather
         than a transparent gap with nothing behind it. */
      .hole.punched .fake-source {
        display: none;
      }
      .src-label {
        font-family: var(--f-body);
        font-weight: 800;
        font-size: 44px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.5);
        text-align: center;
        padding: 0 24px;
      }

      /* tags */
      .panel-tag {
        position: absolute;
        bottom: 32px;
        left: 32px;
        background: var(--ink);
        color: var(--paper);
        font-family: var(--f-display);
        font-size: 50px;
        letter-spacing: 0.06em;
        padding: 8px 24px 4px;
        transform: rotate(-1.2deg);
        box-shadow: 11px 11px 0 var(--marker);
        pointer-events: none;
        z-index: 8;
        animation: tagPulse var(--beat-ms) var(--snap) infinite;
      }
      @keyframes tagPulse {
        0% {
          transform: rotate(-1.2deg) scale(1.045);
        }
        45%,
        100% {
          transform: rotate(-1.2deg) scale(1);
        }
      }
      .panel.is-live .panel-tag {
        box-shadow: 11px 11px 0 var(--cyan);
      }

      /* shared decorations */
      .speedlines {
        position: absolute;
        inset: -30%;
        pointer-events: none;
        background: repeating-conic-gradient(
          from 0deg at 50% 50%,
          rgba(22, 22, 29, 0.3) 0deg 1deg,
          transparent 1deg 3.4deg
        );
        animation: spin 42s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .rays {
        position: absolute;
        inset: -40%;
        pointer-events: none;
        background: repeating-conic-gradient(
          from 0deg at 50% 50%,
          rgba(255, 255, 255, 0.3) 0deg 4deg,
          transparent 4deg 11deg
        );
        animation: spin 26s linear infinite reverse;
      }

      .bubble {
        position: absolute;
        background: var(--paper);
        border: 10px solid var(--ink);
        border-radius: var(--wobble-sm);
        padding: 18px 30px;
        font-family: var(--f-body);
        font-weight: 700;
        color: var(--ink);
        z-index: 7;
      }
      .bubble::after {
        content: "";
        position: absolute;
        bottom: -52px;
        left: 44px;
        border: 26px solid transparent;
        border-top-color: var(--ink);
      }

      .stamp {
        position: absolute;
        display: grid;
        place-items: center;
        font-family: var(--f-display);
        color: var(--yellow);
        -webkit-text-stroke: 12px var(--ink);
        paint-order: stroke fill;
        z-index: 7;
        animation: stampPulse calc(var(--beat-ms) * 2) var(--snap) infinite;
      }
      @keyframes stampPulse {
        0% {
          transform: rotate(-9deg) scale(1.14);
        }
        30%,
        100% {
          transform: rotate(-9deg) scale(0.96);
        }
      }

      .scrawl {
        position: absolute;
        font-family: var(--f-scrawl);
        font-weight: 700;
        color: var(--marker);
        z-index: 7;
        pointer-events: none;
      }

      /* SOCIALS — paper cut-outs taped to every scene panel.

         Sized in CANVAS px through --u, which the build sets to 1 / the
         panel's resting scale. Panels land anywhere from 0.33x (chat) to
         1.17x (cam), so page-px sizes would make the handle 3.5x bigger on
         one scene than another. Always lifted `over`: on game the whole panel
         is a hole, and under-art there would be painted over by the capture. */
      .socials {
        position: absolute;
        z-index: 7;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: calc(var(--u) * 8px);
        pointer-events: none;
      }
      .socials.row {
        flex-direction: row;
        align-items: center;
        gap: calc(var(--u) * 26px);
      }
      /* Two lines: the first two labels side by side, the third under them. */
      .soc-line {
        display: flex;
        align-items: center;
        gap: calc(var(--u) * 26px);
      }
      .soc-row {
        display: flex;
        align-items: center;
      }
      .socials .cut {
        width: calc(var(--u) * 82px);
        height: calc(var(--u) * 82px);
        margin-right: calc(var(--u) * -10px);
        filter: drop-shadow(
          calc(var(--u) * 5px) calc(var(--u) * 5px) 0 rgba(22, 22, 29, 0.55)
        );
        transform: rotate(var(--r, 0deg));
        animation: cutBob calc(var(--beat-ms) * 2) var(--snap) infinite;
      }
      .socials .cut:nth-child(1) {
        --r: -6deg;
      }
      .socials .cut:nth-child(2) {
        --r: 4deg;
        animation-delay: calc(var(--beat-ms) * -1.5);
      }
      .socials .cut:nth-child(3) {
        --r: -3deg;
        animation-delay: calc(var(--beat-ms) * -1);
      }
      @keyframes cutBob {
        0% {
          transform: rotate(var(--r, 0deg)) scale(1.1);
        }
        30%,
        100% {
          transform: rotate(var(--r, 0deg)) scale(1);
        }
      }
      /* Over live video nothing animates (§2) — the game panel is all hole. */
      .p-game .socials .cut {
        animation: none;
      }
      /* drop-shadow on the wrapper, because clip-path on the label clips
         any shadow the label casts itself. */
      .handle {
        margin-left: calc(var(--u) * 16px);
        filter: drop-shadow(
          calc(var(--u) * 5px) calc(var(--u) * 5px) 0 rgba(22, 22, 29, 0.55)
        );
      }
      .handle span {
        display: block;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--f-body);
        font-weight: 800;
        font-size: calc(var(--u) * 34px);
        line-height: 1;
        padding: calc(var(--u) * 12px) calc(var(--u) * 20px)
          calc(var(--u) * 7px);
        white-space: nowrap;
        transform: rotate(-2deg);
        /* Scissor-cut, not torn: straight facets at odd angles. */
        clip-path: polygon(
          0 8%, 22% 0, 51% 6%, 78% 0, 100% 5%,
          98% 52%, 100% 94%, 70% 100%, 38% 95%, 9% 100%, 1% 90%, 2% 48%
        );
      }
      .soc-row + .soc-row .handle span {
        transform: rotate(1.5deg);
      }

      /* ============================================================
   PANEL 1 — STREAM START
   ============================================================ */
      .p-start {
        background: var(--plum);
      }
      .p-start .big {
        position: absolute;
        left: 5%;
        top: 14%;
        font-family: var(--f-display);
        font-size: 300px;
        line-height: 0.82;
        color: var(--yellow);
        -webkit-text-stroke: 14px var(--ink);
        paint-order: stroke fill;
        transform: rotate(-2deg);
      }
      .p-start .clock {
        position: absolute;
        left: 6%;
        top: 62%;
        font-family: var(--f-display);
        font-size: 190px;
        color: var(--paper);
        -webkit-text-stroke: 10px var(--ink);
        paint-order: stroke fill;
        letter-spacing: 0.06em;
      }
      .p-start .scrawl {
        left: 5%;
        top: 6%;
        font-size: 110px;
        transform: rotate(-4deg);
      }

      /* ============================================================
   PANEL 3 — GAMEPLAY
   ============================================================ */
      .p-game {
        background: var(--ink);
      }

      /* ============================================================
   PANEL 4 — FULL CAM
   ============================================================ */
      .p-cam {
        background: var(--mint);
      }

      /* ============================================================
   PANEL 5 — BRB
   ============================================================ */
      .p-brb {
        background: var(--marker);
      }
      .p-brb .big {
        position: absolute;
        left: 4%;
        top: 16%;
        font-family: var(--f-display);
        font-size: 260px;
        line-height: 0.8;
        color: var(--yellow);
        -webkit-text-stroke: 14px var(--ink);
        paint-order: stroke fill;
        transform: rotate(-2.4deg);
      }
      /* Where the mascot lands. Same box the Cam hole used to occupy, drawn
         rather than punched — the taped-on photo inset the art direction
         already calls for, and a plate the mascot's transparency can read
         against instead of live video. */
      .p-brb .mascot-frame {
        position: absolute;
        left: 70%;
        top: 16%;
        width: 26%;
        height: 62%;
        border: 11px solid var(--ink);
        border-radius: var(--wobble-sm);
        background:
          repeating-linear-gradient(
            -18deg,
            rgba(255, 255, 255, 0.16) 0 26px,
            transparent 26px 84px
          ),
          var(--peri);
        box-shadow: 12px 12px 0 rgba(22, 22, 29, 0.6);
      }
      .p-brb .tape {
        position: absolute;
        width: 150px;
        height: 46px;
        background: rgba(244, 241, 232, 0.72);
        border: 3px solid rgba(22, 22, 29, 0.35);
      }
      .p-brb .tape.l {
        left: -46px;
        top: -18px;
        transform: rotate(-32deg);
      }
      .p-brb .tape.r {
        right: -46px;
        bottom: -18px;
        transform: rotate(-32deg);
      }

      /* ============================================================
   PANEL 6 — STREAM END
   ============================================================ */
      .p-end {
        background: var(--navy);
      }
      .p-end .big {
        position: absolute;
        left: 4%;
        top: 12%;
        font-family: var(--f-display);
        font-size: 190px;
        line-height: 0.82;
        color: var(--paper);
        -webkit-text-stroke: 12px var(--ink);
        paint-order: stroke fill;
        transform: rotate(-1.4deg);
      }
      .p-end .rank {
        right: 26%;
        top: 12%;
        width: 340px;
        height: 340px;
        font-size: 280px;
        line-height: 1;
      }
      /* bottom clears the panel tag, which is 32px up from the panel edge and
         about 70px tall — at 8% the last credit line ran straight under it. */
      .credits {
        position: absolute;
        left: 4%;
        bottom: 20%;
        width: 44%;
        height: 30%;
        overflow: hidden;
        z-index: 6;
        /* A roll cut dead flat at both ends reads as clipped text rather than
           as credits. Fades to nothing instead. */
        mask-image: linear-gradient(
          transparent 0%,
          #000 16%,
          #000 84%,
          transparent 100%
        );
        -webkit-mask-image: linear-gradient(
          transparent 0%,
          #000 16%,
          #000 84%,
          transparent 100%
        );
      }
      .credits ul {
        position: absolute;
        list-style: none;
        animation: roll 14s linear infinite;
      }
      .credits li {
        font-family: var(--f-body);
        font-weight: 700;
        font-size: 58px;
        color: var(--paper);
        opacity: 0.85;
        padding: 6px 0;
        white-space: nowrap;
      }
      @keyframes roll {
        from {
          transform: translateY(0);
        }
        to {
          transform: translateY(-50%);
        }
      }

      /* ============================================================
   PANEL 2 — CHAT
   ============================================================ */
      .p-chat {
        background: var(--peri);
      }
      .p-chat .header {
        position: absolute;
        top: 30px;
        left: 30px;
        right: 30px;
        background: var(--ink);
        color: var(--yellow);
        font-family: var(--f-display);
        font-size: 96px;
        letter-spacing: 0.1em;
        padding: 14px 30px 8px;
        transform: rotate(-0.8deg);
        text-align: center;
        z-index: 7;
      }

      /* ============================================================
   ART PANELS
   ============================================================ */
      .p-board {
        background: var(--yellow);
      }
      .p-board .ink-circle {
        position: absolute;
        left: 7%;
        top: 26%;
        width: 50%;
        height: 38%;
        border: 13px solid var(--ink);
        border-radius: 50%;
        transform: rotate(-6deg);
      }
      .p-board .title {
        position: absolute;
        left: 12%;
        top: 33%;
        font-family: var(--f-marker);
        font-size: 190px;
        color: var(--marker);
        transform: rotate(-4deg);
      }
      .p-board .note {
        left: 30%;
        top: 64%;
        font-size: 130px;
        transform: rotate(-11deg);
      }
      .p-board .photo {
        position: absolute;
        border: 11px solid var(--ink);
        background: var(--peri);
        border-radius: var(--wobble-sm);
        display: grid;
        place-items: center;
        font-family: var(--f-display);
        font-size: 110px;
        color: var(--ink);
      }
      .p-board svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .p-board .dash {
        fill: none;
        stroke: var(--ink);
        stroke-width: 1.2;
        stroke-dasharray: 4 3;
        animation: march 2s linear infinite;
      }
      @keyframes march {
        to {
          stroke-dashoffset: -14;
        }
      }

      .p-np {
        background: var(--navy);
      }
      .np-label {
        position: absolute;
        top: 36px;
        left: 36px;
        font-family: var(--f-display);
        font-size: 70px;
        color: var(--yellow);
        letter-spacing: 0.08em;
      }
      .np-track {
        position: absolute;
        top: 140px;
        left: 36px;
        right: 36px;
        font-family: var(--f-body);
        font-weight: 700;
        font-size: 54px;
        color: var(--paper);
        opacity: 0.85;
      }
      .eq {
        position: absolute;
        bottom: 56px;
        left: 36px;
        right: 36px;
        height: 260px;
        display: flex;
        align-items: flex-end;
        gap: 15px;
      }
      .eq i {
        flex: 1;
        background: var(--cyan);
        display: block;
        height: 30%;
        animation: eqb var(--beat-ms) var(--snap) infinite;
      }
      .eq i:nth-child(2n) {
        animation-duration: calc(var(--beat-ms) * 2);
      }
      .eq i:nth-child(3n) {
        animation-duration: calc(var(--beat-ms) / 2);
        background: var(--yellow);
      }
      @keyframes eqb {
        0% {
          height: 100%;
        }
        60%,
        100% {
          height: 22%;
        }
      }

      .p-alert {
        background: var(--peri);
      }
      .p-alert .burst {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-family: var(--f-display);
        font-size: 220px;
        color: var(--yellow);
        -webkit-text-stroke: 14px var(--ink);
        paint-order: stroke fill;
        z-index: 6;

      /* ============================================================
   DEBUG HUD — ?debug=1 only. Never rendered on a live overlay.
   ============================================================ */

      @media (prefers-reduced-motion: reduce) {

    </style>
  </head>
  <body>
    <div class="viewport" id="viewport">
      <div class="shaker" id="shaker"><div class="page" id="page"></div></div>
    </div>

    <script>
      const PAGE_W = 7680,
        PAGE_H = 4320,
        CANVAS_W = 1920,
        CANVAS_H = 1080;

      /* Declared up front: applyPunch() runs at build time, long before the
         OBS WIRING section below, and reaching a `const` from there would hit
         the temporal dead zone and abort the script mid-startup. */
      const params = new URLSearchParams(location.search);
      const DEBUG = params.has("debug");

      /* ================================================================
   PANEL CONFIG — single source of truth.

   holes[] are transparent windows inside a panel. Each maps to one
   OBS source by name. Coordinates are PERCENTAGES of the panel, so
   art and hole can never drift apart when a panel is resized.
   ================================================================ */
      const PANELS = [
        {
          id: 1,
          key: "start",
          cls: "p-start",
          fit: "fit",
          x: 64,
          y: 64,
          w: 2360,
          h: 1180,

          rot: 0.8,

          /* In the gutter, not the panel: at 0.33x the portrait panel has no
             strip wide enough for a handle, and leaves 563 canvas px of empty

          socials: { page: { x: 7747, y: 289 }, size: 0.9 },

        {

          fit: "fill",

          /* Straddles the bottom of the window frame — the mint strip under

          socials: { at: "right:5%;bottom:1%", layout: "row", size: 0.9 },
          rays: true,
          holes: [
            {

              x: 6,

        {
          id: 5,

          cls: "p-brb",
          fit: "fit",
          x: 64,
          y: 3300,
          w: 2360,
          h: 956,
          rot: 1.1,
          tag: "BRB",
          /* Under BE RIGHT BACK, left of the mascot frame (from 70%). */
          socials: { at: "left:4%;top:64%", layout: "pair" },
          /* No holes. The webcam window that used to sit at 70%,16%,26%,62%
             is now the mascot's spot — see .p-brb .mascot-frame, and the BRB
             entry in mascot/placement.json that lands the deer inside it.
             A hole here would also have claimed the single Cam item away
             from the game panel bleeding into frame above. */
          holes: [],
        },

        {
          id: 6,
          key: "end",
          cls: "p-end",
          fit: "fit",
          x: 2472,
          y: 3300,
          w: 2680,
          h: 956,
          rot: -0.6,
          tag: "STREAM END",
          /* Under the webcam, right of the tag. */
          socials: { at: "right:4%;bottom:3%", layout: "row" },
          holes: [
            {
              src: "Cam",
              x: 74,
              y: 14,
              w: 22,
              h: 66,
              label: "Cam",
              c: "#4a3a1e",
            },
          ],
        },

        {
          id: 7,
          key: "board",
          cls: "p-board",
          fit: "fit",
          x: 2472,
          y: 64,
          w: 2680,
          h: 1180,
          rot: 0.7,
          tag: "INTEL",
          holes: [],
        },

        {
          id: 8,
          key: "np",
          cls: "p-np",
          fit: "fit",
          x: 5200,
          y: 3300,
          w: 2416,
          h: 956,
          rot: 1.3,
          tag: "NOW PLAYING",
          holes: [],
        },

        {
          id: 9,
          key: "alert",
          cls: "p-alert",
          fit: "fit",
          x: 3512,
          y: 2296,
          w: 1640,
          h: 956,
          rot: 1.6,
          tag: "ALERTS",
          holes: [],
        },
      ];

      /* Platforms that share a handle share a label. */
      const SOCIALS = [
        { handle: "thedeepeffect", on: ["kick"] },
        { handle: "thedeepeffect_", on: ["twitch", "youtube"] },
        { handle: "@thedeepeffect__", on: ["instagram"] },
      ];
      const SOCIAL_NAMES = {
        kick: "Kick",
        twitch: "Twitch",
        youtube: "YouTube",
        instagram: "Instagram",
      };

      /* The panel's resting scale — what transformFor() lands it at. */
      function restScale(p) {
        const sx = CANVAS_W / p.w,
          sy = CANVAS_H / p.h;
        return p.fit === "fill" ? Math.max(sx, sy) : Math.min(sx, sy) * 0.97;
      }

      function socialsFor(p, cls, style) {
        const s = p.socials,
          u = (s.size || 1) / restScale(p);
        return (
          `<div class="socials ${s.layout || "stack"} ${cls}" style="--u:${u.toFixed(4)};${style}">` +
          SOCIALS.map(
            (g, i) =>
              (s.layout === "pair" && i === 0 ? `<div class="soc-line">` : "") +
              `<div class="soc-row">` +
              g.on
                .map(
                  (n) =>
                    `<img class="cut" src="../../assets/socials/${n}.svg" alt="${SOCIAL_NAMES[n]}">`,
                )
                .join("") +
              `<span class="handle"><span>${g.handle}</span></span></div>` +
              (s.layout === "pair" && i === 1 ? `</div>` : ""),
          ).join("") +
          `</div>`
        );
      }

      /* Beat from a shared wall-clock epoch — no sync messages, ever. */
      const BPM = 120,
        BEAT_MS = 60000 / BPM,
        EPOCH = 0;
      const beatPhase = () => ((Date.now() - EPOCH) % BEAT_MS) / BEAT_MS;

      /* ================================================================
   PANEL ART
   ================================================================ */
      function artFor(p) {
        switch (p.key) {
          case "start":
            return `
      <div class="rays"></div>
      <div class="scrawl">get comfy</div>
      <div class="big">STAND<br>BY</div>
      <div class="clock" id="countdown">05:00</div>`;
          case "chat":
            return `<div class="header">CHAT</div>`;
          case "cam":
            return `<div class="rays"></div>`;
          case "brb":
            /* The frame is empty on purpose: the mascot browser source sits
               above this overlay in COMIC and paints into it. Drawn, not
               punched — a hole would be a transparent rectangle, and the
               mascot's own transparency needs comic art behind it. */
            return `
      <div class="big">BE RIGHT<br>BACK</div>
      <div class="mascot-frame"><span class="tape l"></span><span class="tape r"></span></div>
      <div class="bubble over" style="right:4%;top:4%;font-size:64px">back soon</div>`;
          case "end":
            return `
      <div class="big">MISSION<br>COMPLETE</div>
      <div class="stamp rank">S</div>
      <div class="credits"><ul>
        <li>thanks for watching</li><li>chat MVP — you</li>
        <li>mascot — the deer</li>
        <li>thanks for watching</li><li>chat MVP — you</li>
        <li>mascot — the deer</li>
      </ul></div>`;
          case "board":
            return `
      <div class="ink-circle"></div>
      <div class="title">INTEL</div>
      <div class="scrawl note">insider?</div>
      <div class="photo" style="left:63%;top:8%;width:22%;height:46%">?</div>
      <div class="photo" style="left:70%;top:60%;width:19%;height:32%">!</div>
      <svg viewBox="0 0 100 100" preserveAspectRatio="none">
        <path class="dash" d="M 54 46 L 74 70"/><path class="dash" d="M 52 28 L 68 24"/>
      </svg>`;
          case "np":
            return `
      <div class="np-label">NOW PLAYING</div>
      <div class="np-track">Untitled Sample — 120 BPM</div>
      <div class="eq">${"<i></i>".repeat(14)}</div>`;
          case "alert":
            return `<div class="burst">BAM!</div>`;
          default:
            return "";
        }
      }

      /* ================================================================
   BUILD
   ================================================================ */
      /* frameEl, not `viewport` — Chrome/CEF already define window.viewport,
         which shadows id-based global lookup and yields a platform object
         with no getBoundingClientRect. */
      const frameEl = document.getElementById("viewport"),
        pageEl = document.getElementById("page"),
        panelEls = {},
        holeEls = [];

      ["skirt-n", "skirt-s", "skirt-w", "skirt-e"].forEach((c) => {
        const b = document.createElement("div");
        b.className = c;
        pageEl.appendChild(b);
      });

      const pageUnder = document.createElement("div");
      pageUnder.className = "page-under";
      pageEl.appendChild(pageUnder);

      PANELS.forEach((p) => {
        const el = document.createElement("div");
        el.className = `panel ${p.cls}`;
        el.dataset.id = p.id;
        Object.assign(el.style, {
          left: p.x + "px",
          top: p.y + "px",
          width: p.w + "px",
          height: p.h + "px",
          transform: `rotate(${p.rot}deg)`,
        });

        const holesHTML = (p.holes || [])
          .map(
            (h, i) =>
              `<div class="hole${h.bare ? " bare" : ""}" data-hole="${p.key}:${i}"
       style="left:${h.x}%;top:${h.y}%;width:${h.w}%;height:${h.h}%">
       <div class="fake-source" style="--src:${h.c}">
         <span class="src-label">${h.label}</span></div>
     </div>`,
          )
          .join("");

        /* Order is the whole trick: .under is masked, everything after it is
           not. Holes keep their inked borders and hard shadows, and the
           speedlines and tag stay on top of the video. */
        const panelSocials =
          p.socials && !p.socials.page ? socialsFor(p, "over", p.socials.at) : "";
        el.innerHTML =
          `<div class="under">${artFor(p)}${panelSocials}` +
          (p.speedlines ? '<div class="speedlines"></div>' : "") +
          `</div>` +
          holesHTML +
          `<span class="panel-tag">${p.tag}</span>`;

        /* Art marked `over` is lifted out of the masked layer so it reads on
           top of the video instead of being covered by it. */
        el.querySelectorAll(".under .over").forEach((n) => el.appendChild(n));

        pageEl.appendChild(el);
        panelEls[p.id] = el;
        /* Gutter-placed socials ride the page, outside every mask. */
        if (p.socials && p.socials.page)
          pageEl.insertAdjacentHTML(
            "beforeend",
            socialsFor(
              p,
              "",
              `left:${p.socials.page.x}px;top:${p.socials.page.y}px`,
            ),
          );
        (p.holes || []).forEach((h, i) =>
          holeEls.push({
            src: h.src,
            key: `${p.key}:${h.src}`,
            panelId: p.id,
            el: el.querySelector(`[data-hole="${p.key}:${i}"]`),
          }),
        );
      });

      /* The panel's own background has to move into .under, or it paints
         behind the hole and no mask on .under can help. Copied as longhands
         so per-panel gradients and sizing survive verbatim. */
      PANELS.forEach((p) => {
        const el = panelEls[p.id],
          under = el.querySelector(".under");
        if (!under) return;
        const cs = getComputedStyle(el);
        Object.assign(under.style, {
          backgroundColor: cs.backgroundColor,
          backgroundImage: cs.backgroundImage,
          backgroundSize: cs.backgroundSize,
          backgroundPosition: cs.backgroundPosition,
          backgroundRepeat: cs.backgroundRepeat,
        });
        el.style.background = "none";
      });

      const PANEL_BORDER = 15; /* matches .panel border-width */

      /* Page-space geometry per hole, from the same config the DOM is built
         from. Lets us work out where every hole WILL be once a pan lands,
         before it starts, without measuring the DOM mid-flight. */
      (() => {
        const probe = pageEl.querySelector(".hole:not(.bare)");
        const HB = probe
          ? parseFloat(getComputedStyle(probe).borderTopWidth)
          : 11;
        let k = 0;
        PANELS.forEach((p) => {
          const cx = p.x + p.w / 2,
            cy = p.y + p.h / 2;
          const iw = p.w - 2 * PANEL_BORDER,
            ih = p.h - 2 * PANEL_BORDER;
          (p.holes || []).forEach((h) => {
            const b = h.bare ? 0 : HB;
            const lx = (iw * h.x) / 100,
              ly = (ih * h.y) / 100,
              lw = (iw * h.w) / 100,
              lh = (ih * h.h) / 100;
            Object.assign(holeEls[k++], {
              rot: p.rot,
              cx,
              cy,
              panelW: iw,
              panelH: ih,
              /* content box, panel-local — cuts the .under mask */
              local: { x: lx + b, y: ly + b, w: lw - 2 * b, h: lh - 2 * b },
              /* border box, page-space — what OBS is told to fill */
              page: {
                x: p.x + PANEL_BORDER + lx,
                y: p.y + PANEL_BORDER + ly,
                w: lw,
                h: lh,
              },
              /* content box, page-space — cuts the .page-under mask */
              pageInner: {
                x: p.x + PANEL_BORDER + lx + b,
                y: p.y + PANEL_BORDER + ly + b,
                w: lw - 2 * b,
                h: lh - 2 * b,
              },
            });
          });
        });
      })();

      /* Shared mutable state, declared up front. applyPunch() runs as soon as
         the first scene arrives, which can be before the websocket and
         placement sections below have been evaluated — reaching them through
         their own `const` would hit the temporal dead zone and abort the
         script mid-startup. */
      let ws = null,
        wsReady = false,
        reqId = 0,
        backoff = 1000,
        punched = new Set();
      const pendingReq = new Map();
      const itemIds = new Map(); /* sourceName -> sceneItemId */
      const srcSize = new Map(); /* sourceName -> {w, h} in source pixels */
      const itemOn = new Map(); /* sourceName -> enabled, as OBS last reported */
      const managed = new Set(holeEls.map((h) => h.src));

      /* The browser stands in for the game. `Browser` is a window capture
         with no hole of its own: while it is UNMUTED it fills whatever hole
         Game would have filled, and Game parks. Mute is the switch because it
         already is one for the audio, and the deck and OBS's mixer can both
         flip it. Muted, missing or unknown, the game shows — the browser
         never goes on air on a guess. CLAUDE.md §2. */
      const BROWSER = "Browser";
      let browserLive = false;
      const feed = (src) =>
        src === "Game" && browserLive && itemIds.has(BROWSER) ? BROWSER : src;

      /* ================================================================
   HOLE PUNCH — masks generated from the same PANELS config.

   CSS transparency cannot reach through an ancestor's background, so
   two things paint behind every hole and both have to be cut: the
   page (gutter + halftone) and the panel's own art layer, .under.

   Nothing else is masked. The .hole element keeps its inked border and
   hard drop shadow, the panel keeps its border, radius and shadow, and
   the speedlines and tag keep sitting on top — all of which now land
   over live video instead of over a placeholder fill.

   The cut is ONE path per mask with fill-rule="evenodd". Separate
   <rect> elements each fill on their own and cut nothing, and an SVG
   <mask> element does not resolve its own url(#id) once the SVG is a
   data-URI image. Both render, both are silently wrong.
   ================================================================ */

      const rotPt = (px, py, cx, cy, deg) => {
        const a = (deg * Math.PI) / 180,
          c = Math.cos(a),
          s = Math.sin(a),
          dx = px - cx,
          dy = py - cy;
        return [cx + dx * c - dy * s, cy + dx * s + dy * c];
      };

      /* Corners rotated by hand: a quad carries the panel tilt exactly, where
         an axis-aligned rect would leave slivers at the corners. deg 0 for
         panel-local masks, which are already square to their own box. */
      const quad = (x, y, w, h, cx, cy, deg) =>
        "M" +
        [
          [x, y],
          [x + w, y],
          [x + w, y + h],
          [x, y + h],
        ]
          .map(([px, py]) =>
            rotPt(px, py, cx, cy, deg)
              .map((n) => n.toFixed(1))
              .join(" "),
          )
          .join("L") +
        "Z";

      /* One opaque ground with the cuts punched out of it, as a mask image. */
      function applyMask(el, X, Y, W, H, cuts) {
        const d = `M${X} ${Y}H${X + W}V${Y + H}H${X}Z` + cuts;
        const svg =
          `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" ` +
          `viewBox="${X} ${Y} ${W} ${H}">` +
          `<path fill="#000" fill-rule="evenodd" d="${d}"/></svg>`;
        const uri = `url("data:image/svg+xml;utf8,${encodeURIComponent(svg)}")`;
        Object.assign(el.style, {
          maskImage: uri,
          webkitMaskImage: uri,
          maskSize: `${W}px ${H}px`,
          webkitMaskSize: `${W}px ${H}px`,
          maskPosition: `${X}px ${Y}px`,
          webkitMaskPosition: `${X}px ${Y}px`,
          maskRepeat: "no-repeat",
          webkitMaskRepeat: "no-repeat",
          /* mask-clip defaults to border-box. Every mask here is authored in
             its element's own box so the default would do, but a cut whose
             rounding lands a hair outside would be clipped away silently. */
          maskClip: "no-clip",
          webkitMaskClip: "no-clip",
        });
      }

      /* Corners of a panel-local rect after the panel's own tilt, page-space. */
      function pageCorners(r, cx, cy, deg) {
        return [
          [r.x, r.y],
          [r.x + r.w, r.y],
          [r.x + r.w, r.y + r.h],
          [r.x, r.y + r.h],
        ].map(([x, y]) => rotPt(x, y, cx, cy, deg));
      }

      /* Where every hole lands once a pan to `id` has settled. Pure math on the
         target transform, so the punch set is decided up front instead of
         being chased frame by frame. */
      function restingRects(id) {
        const m = new DOMMatrix(transformFor(String(id)));
        return holeEls.map((h) => {
          const pts = pageCorners(h.page, h.cx, h.cy, h.rot).map(([x, y]) =>
            m.transformPoint(new DOMPoint(x, y)),
          );
          const xs = pts.map((q) => q.x),
            ys = pts.map((q) => q.y);
          const x = Math.min(...xs),
            y = Math.min(...ys);
          const w = Math.max(...xs) - x,
            hh = Math.max(...ys) - y;
          const vx = Math.max(0, Math.min(CANVAS_W, x + w) - Math.max(0, x));
          const vy = Math.max(0, Math.min(CANVAS_H, y + hh) - Math.max(0, y));
          return { hole: h, onScreen: vx * vy };
        });
      }

      /* One OBS item per source, so a source can only be in one hole at a time
         — Cam is referenced by four panels. The panel on air wins; failing
         that, whichever hole shows the most of itself takes it. That is what
         lets a neighbour bleeding into frame show real video instead of a
         placeholder, while never leaving two holes fighting over one item. */
      function chooseWinners(id) {
        const best = new Map();
        restingRects(id).forEach((r) => {
          if (!r.onScreen) return;
          const live = r.hole.panelId === id;
          const cur = best.get(r.hole.src);
          if (
            !cur ||
            (live && !cur.live) ||
            (live === cur.live && r.onScreen > cur.onScreen)
          )
            best.set(r.hole.src, { hole: r.hole, live, onScreen: r.onScreen });
        });
        return new Set([...best.values()].map((v) => v.hole));
      }

      /* fill-rule evenodd counts crossings, so a cut that lies INSIDE another
         cut flips that region back to opaque. The game panel hits this every
         time: its `bare` Game hole is the whole panel, and the Cam hole sits
         inside it — winding 3, odd, and the webcam window paints solid panel
         art over live video. Since the union of A ⊇ B is just A, dropping the
         contained cut is exact, and it is the only overlap the layout can
         produce: holes within a panel are authored side by side, and panels
         never overlap each other. Partial overlap would still flip, so it is
         called out loudly rather than rendered wrong in silence. */
      const contains = (a, b) =>
        b.x >= a.x &&
        b.y >= a.y &&
        b.x + b.w <= a.x + a.w &&
        b.y + b.h <= a.y + a.h;

      function mergeCuts(holes) {
        const kept = holes.filter(
          (h) => !holes.some((g) => g !== h && contains(g.local, h.local)),
        );
        if (DEBUG)
          kept.forEach((h, i) =>
            kept.slice(i + 1).forEach((g) => {
              const o =
                h.local.x < g.local.x + g.local.w &&
                g.local.x < h.local.x + h.local.w &&
                h.local.y < g.local.y + g.local.h &&
                g.local.y < h.local.y + h.local.h;
              if (o) hud(`cuts overlap: ${h.key} / ${g.key}`, true);
            }),
          );
        return kept;
      }

      /* Only winning holes are cut. Everything else keeps its art, so no hole
         is ever transparent with nothing behind it. Rebuilt per scene change —
         two small data URIs, once per pan. */
      function applyPunch(id) {
        punched = id >= 0 ? chooseWinners(id) : new Set();
        holeEls.forEach((h) =>
          h.el.classList.toggle("punched", punched.has(h)),
        );

        let pageCuts = "";
        PANELS.forEach((p) => {
          const under = panelEls[p.id].querySelector(".under");
          if (!under) return;
          const mine = mergeCuts(
            holeEls.filter((h) => h.panelId === p.id && punched.has(h)),
          );
          if (!mine.length) {
            under.style.maskImage = "none";
            under.style.webkitMaskImage = "none";
            return;
          }
          let panelCuts = "";
          mine.forEach((h) => {
            panelCuts += quad(
              h.local.x,
              h.local.y,
              h.local.w,
              h.local.h,
              0,
              0,
              0,
            );
            /* Same hole in .page-under's box, which is the page itself —
               the skirt is a separate, unmasked element, so page-space
               coordinates go straight in. */
            pageCuts += quad(
              h.pageInner.x,
              h.pageInner.y,
              h.pageInner.w,
              h.pageInner.h,
              h.cx,
              h.cy,
              h.rot,
            );
          });
          applyMask(under, 0, 0, mine[0].panelW, mine[0].panelH, panelCuts);
        });

        applyMask(pageUnder, 0, 0, PAGE_W, PAGE_H, pageCuts);
        syncVisibility();
      }
      applyPunch(-1); /* nothing live yet — page fully opaque */

      /* Countdown on the standby panel */
      let secs = 300;
      setInterval(() => {
        const c = document.getElementById("countdown");
        if (!c) return;
        secs = secs > 0 ? secs - 1 : 300;
        c.textContent = `${String(Math.floor(secs / 60)).padStart(2, "0")}:${String(secs % 60).padStart(2, "0")}`;
      }, 1000);

      /* ================================================================
   PAN MATH
     translate(viewport centre)
     rotate(-panel tilt)      -> panel squares up to the frame
     scale(fit)
     translate(-panel centre)
   ================================================================ */
      let current = null;
      function transformFor(t) {
        if (t === "page") {
          const s = Math.min(CANVAS_W / PAGE_W, CANVAS_H / PAGE_H) * 0.94;
          return `translate(${CANVAS_W / 2}px,${CANVAS_H / 2}px) scale(${s}) translate(${-PAGE_W / 2}px,${-PAGE_H / 2}px)`;
        }
        const p = PANELS.find((v) => v.id === Number(t));
        const s = restScale(p);
        const cx = p.x + p.w / 2,
          cy = p.y + p.h / 2;
        return `translate(${CANVAS_W / 2}px,${CANVAS_H / 2}px) rotate(${-p.rot}deg) scale(${s}) translate(${-cx}px,${-cy}px)`;
      }

      const shaker = document.getElementById("shaker");
      let shakeTimer;

      const PAN_MS = parseFloat(
        getComputedStyle(document.documentElement).getPropertyValue("--pan-ms"),
      );

      /* instant:true lands on the panel with no travel — used once, when the
         overlay learns which scene was already live at launch. Panning in
         from nowhere on OBS startup would look like a glitch. */
      function goTo(t, { instant = false } = {}) {
        current = t;
        applyPunch(Number(t));
        Object.entries(panelEls).forEach(([id, el]) =>
          el.classList.toggle("is-live", id === String(t)),
        );

        clearTimeout(shakeTimer);

        if (instant) {
          pageEl.style.transition = "none";
          pageEl.style.transform = transformFor(t);
          void pageEl.offsetWidth;
          pageEl.style.transition = "";
          startTracking(120);
          return;
        }

        pageEl.style.transform = transformFor(t);
        startTracking(PAN_MS + 260); /* pan, plus the shake settling after it */

        shakeTimer = setTimeout(() => {
          shaker.classList.remove("shake");
          void shaker.offsetWidth;
          shaker.classList.add("shake");
        }, 810);
      }

      /* ================================================================
   HOLE RECTS — one row per hole, already in OBS canvas coordinates.

   Tracking runs only while the page is moving, then stops dead. Idle
   cost is zero; there is no timer ticking between pans. Step 6 pushes
   these to OBS from inside track().
   ================================================================ */
      function holeRects() {
        const vp = frameEl.getBoundingClientRect();
        return holeEls.map((h) => {
          const r = h.el.getBoundingClientRect();
          const x = r.left - vp.left,
            y = r.top - vp.top;
          return {
            hole: h,
            src: h.src,
            key: h.key,
            x,
            y,
            w: r.width,
            h: r.height,
            visible:
              x < CANVAS_W &&
              y < CANVAS_H &&
              x + r.width > 0 &&
              y + r.height > 0,
          };
        });
      }

      let trackRAF = 0,
        trackUntil = 0;

      function track() {
        const rects = holeRects();
        if (DEBUG) paintRects(rects);
        pushRects(rects);
        if (performance.now() < trackUntil)
          trackRAF = requestAnimationFrame(track);
        else trackRAF = 0;
      }

      /* Extends the window, never shortens it. The short 120ms nudges — a
         reconnect, or the per-scene size refresh — can land in the middle of
         a pan, and cutting the pan's own window short leaves every source
         frozen at whatever half-way rect it had reached. */
      function startTracking(ms) {
        trackUntil = Math.max(trackUntil, performance.now() + ms);
        /* Pushed this frame, not the next. applyPunch has already cut the new
           holes, so waiting a frame leaves each newly punched hole showing
           whatever is behind it — since unused sources park off-canvas, that
           is bare canvas. track() schedules its own successor. */
        if (!trackRAF) track();
      }

      /* ================================================================
   OBS WIRING

   Scene detection is window.obsstudio first, websocket second.
   Measured on OBS 32.0.1 / obs-websocket 5.6.3: both paths fire on
   every switch and land within one 60fps frame of each other, but
   obsstudio keeps working when the socket is down. See CLAUDE.md §2.
   ================================================================ */
      /* Scenes UPPERCASE, sources TitleCase — OBS shares one namespace. */
      const HOST_SCENE = "COMIC";
      const SCENE_MAP = {
        START: 1,
        CHAT: 2,
        GAME: 3,
        CAM: 4,
        BRB: 5,
        END: 6,
      };

      let currentScene = null,
        seeded = false;

      function applyScene(name, via) {
        if (!name) return;

        /* The host scene is not a panel. Clicking COMIC in OBS during setup
           must not move the page. */
        if (name === HOST_SCENE)
          return hud(`${via}: ${name} — host scene, ignored`, true);

        const id = SCENE_MAP[name];
        if (!id) return hud(`${via}: ${name} — unknown scene, ignored`, true);

        /* Both paths report the same switch a few ms apart. First one wins;
           the second is a no-op rather than a second pan. */
        if (name === currentScene) return;

        currentScene = name;
        const first = !seeded;
        seeded = true;
        goTo(String(id), { instant: first });
        syncVisibility();
        /* Re-read sizes, because the crop that makes a source fill its opening
           depends on them and a capture can change resolution at any time —
           a game going fullscreen, a webcam renegotiating. One request per
           pan, against an idle cost of zero between them. */
        if (wsReady) loadItemIds({ quiet: true });
        hud(`${via}: ${name} → panel ${id}${first ? " (seed)" : ""}`);
      }

      /* --- path A: window.obsstudio ------------------------------------ */
      window.addEventListener("obsSceneChanged", (e) =>
        applyScene(e.detail && e.detail.name, "obsstudio"),
      );

      /* getCurrentScene() comes back null at startup in a nested source — it
         only learns on the first change. Retry for a few seconds, and let the
         websocket seed us if it never answers. */
      (function seedFromObsStudio(tries) {
        if (seeded || !window.obsstudio) return;
        try {
          window.obsstudio.getCurrentScene((sc) => {
            if (sc && sc.name) applyScene(sc.name, "obsstudio/seed");
          });
        } catch (_) {}
        if (tries < 12) setTimeout(() => seedFromObsStudio(tries + 1), 300);
      })(0);

      /* --- path B: obs-websocket v5 ------------------------------------ */
      const K = [
        0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1,
        0x923f82a4, 0xab1c5ed5, 0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3,
        0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174, 0xe49b69c1, 0xefbe4786,
        0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
        0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147,
        0x06ca6351, 0x14292967, 0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13,
        0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85, 0xa2bfe8a1, 0xa81a664b,
        0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
        0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a,
        0x5b9cca4f, 0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208,
        0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2,
      ];
      const rotr = (x, n) => ((x >>> n) | (x << (32 - n))) >>> 0;

      /* Hand-rolled because crypto.subtle needs a secure context and this
         page is loaded from file:// inside CEF. Verified against node's
         crypto over 285 vectors. */
      function sha256(bytes) {
        const len = bytes.length;
        const buf = new Uint8Array(((len + 9 + 63) >> 6) << 6);
        buf.set(bytes);
        buf[len] = 0x80;
        const dv = new DataView(buf.buffer);
        dv.setUint32(buf.length - 4, (len * 8) >>> 0, false);
        dv.setUint32(buf.length - 8, Math.floor((len * 8) / 4294967296), false);

        let H = [
          0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f,
          0x9b05688c, 0x1f83d9ab, 0x5be0cd19,
        ];
        const w = new Uint32Array(64);

        for (let i = 0; i < buf.length; i += 64) {
          for (let j = 0; j < 16; j++) w[j] = dv.getUint32(i + j * 4, false);
          for (let j = 16; j < 64; j++) {
            const a = w[j - 15],
              b = w[j - 2];
            const s0 = (rotr(a, 7) ^ rotr(a, 18) ^ (a >>> 3)) >>> 0;
            const s1 = (rotr(b, 17) ^ rotr(b, 19) ^ (b >>> 10)) >>> 0;
            w[j] = (w[j - 16] + s0 + w[j - 7] + s1) >>> 0;
          }
          let [a, b, c, d, e, f, g, h] = H;
          for (let j = 0; j < 64; j++) {
            const S1 = (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) >>> 0;
            const ch = ((e & f) ^ (~e & g)) >>> 0;
            const t1 = (h + S1 + ch + K[j] + w[j]) >>> 0;
            const S0 = (rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) >>> 0;
            const maj = ((a & b) ^ (a & c) ^ (b & c)) >>> 0;
            const t2 = (S0 + maj) >>> 0;
            h = g;
            g = f;
            f = e;
            e = (d + t1) >>> 0;
            d = c;
            c = b;
            b = a;
            a = (t1 + t2) >>> 0;
          }
          H = H.map((v, k) => (v + [a, b, c, d, e, f, g, h][k]) >>> 0);
        }
        const out = new Uint8Array(32);
        const odv = new DataView(out.buffer);
        H.forEach((v, i) => odv.setUint32(i * 4, v, false));
        return out;
      }

      const utf8 = (str) => new TextEncoder().encode(str);
      const b64 = (bytes) => btoa(String.fromCharCode(...bytes));
      const catBytes = (a, b) => {
        const r = new Uint8Array(a.length + b.length);
        r.set(a);
        r.set(b, a.length);
        return r;
      };
      const authString = (pw, salt, challenge) =>
        b64(
          sha256(catBytes(utf8(b64(sha256(utf8(pw + salt)))), utf8(challenge))),
        );

      const WS_URL = params.get("host") || "ws://127.0.0.1:4455";
      const WS_PW = params.get("pw") || "";

      function request(type, data) {
        return new Promise((resolve, reject) => {
          if (!wsReady) return reject(new Error("not identified"));
          const id = "r" + ++reqId;
          pendingReq.set(id, { resolve, reject });
          ws.send(
            JSON.stringify({
              op: 6,
              d: { requestType: type, requestId: id, requestData: data || {} },
            }),
          );
        });
      }

      function connect() {
        try {
          ws = new WebSocket(WS_URL);
        } catch (_) {
          return scheduleReconnect();
        }

        ws.onclose = () => {
          wsReady = false;
          pendingReq.clear();
          hud("websocket: closed", true);
          scheduleReconnect();
        };
        ws.onerror = () => {}; /* onclose always follows; handle it there */

        ws.onmessage = (ev) => {
          const msg = JSON.parse(ev.data);

          if (msg.op === 0) {
            /* General | Scenes | Inputs — Inputs for Browser's mute. */
            const d = { rpcVersion: 1, eventSubscriptions: 1 | 4 | 8 };
            if (msg.d.authentication) {
              if (!WS_PW) {
                hud("websocket: server wants a password, none given", true);
                return ws.close();
              }
              d.authentication = authString(
                WS_PW,
                msg.d.authentication.salt,
                msg.d.authentication.challenge,
              );
            }
            ws.send(JSON.stringify({ op: 1, d }));
            return;
          }

          if (msg.op === 2) {
            wsReady = true;
            backoff = 1000;
            hud("websocket: identified");
            /* Seeds the panel if obsstudio hasn't already, and re-syncs after
               a reconnect in case a switch happened while we were away. */
            request("GetSceneList")
              .then((r) =>
                applyScene(r.currentProgramSceneName, "websocket/seed"),
              )
              .catch(() => {});
            loadItemIds();
            request("GetInputMute", { inputName: BROWSER })
              .then((r) => setBrowserLive(!r.inputMuted))
              .catch(() => setBrowserLive(false));
            return;
          }

          if (msg.op === 5) {
            const e = msg.d.eventData || {};
            if (msg.d.eventType === "CurrentProgramSceneChanged")
              applyScene(e.sceneName, "websocket");
            else if (e.inputName === BROWSER) {
              if (msg.d.eventType === "InputMuteStateChanged")
                setBrowserLive(!e.inputMuted);
              else if (msg.d.eventType === "InputRemoved") setBrowserLive(false);
            }
            return;
          }

          if (msg.op === 9) return; /* RequestBatchResponse — fire and forget */

          if (msg.op === 7) {
            const pr = pendingReq.get(msg.d.requestId);
            if (!pr) return;
            pendingReq.delete(msg.d.requestId);
            if (msg.d.requestStatus.result)
              pr.resolve(msg.d.responseData || {});
            else pr.reject(new Error(msg.d.requestStatus.comment || "failed"));
          }
        };
      }

      function scheduleReconnect() {
        setTimeout(connect, backoff);
        backoff = Math.min(backoff * 2, 8000);
      }

      connect();

      /* ================================================================
   SOURCE PLACEMENT

   Transforms address items by id, so the name -> id map is fetched
   once and cached. Sources are addressed inside COMIC even though a
   trigger scene is what's on program; that nesting was verified in
   step 3.

   Only the LIVE panel's holes may drive a source. Cam is referenced by
   four panels but is one item in COMIC, so two holes claiming it
   mid-pan would fight over the same transform.
   ================================================================ */
      function loadItemIds({ quiet = false } = {}) {
        request("GetSceneItemList", { sceneName: HOST_SCENE })
          .then((r) => {
            itemIds.clear();
            itemOn.clear();
            r.sceneItems.forEach((i) => {
              itemIds.set(i.sourceName, i.sceneItemId);
              itemOn.set(i.sourceName, i.sceneItemEnabled !== false);
              /* Source pixel size, needed to compute the fill crop below. A
                 source that has not produced a frame yet reports 0 — left out
                 so pushRects falls back until it has. */
              const t = i.sceneItemTransform || {};
              if (t.sourceWidth > 0 && t.sourceHeight > 0)
                srcSize.set(i.sourceName, {
                  w: t.sourceWidth,
                  h: t.sourceHeight,
                });
            });
            const missing = [...managed].filter((n) => !itemIds.has(n));
            if (missing.length || !quiet)
              hud(
                missing.length
                  ? `sources missing from ${HOST_SCENE}: ${missing.join(", ")}`
                  : `sources bound: ${[...managed].join(", ")}`,
                missing.length > 0,
              );
            syncVisibility();
            startTracking(120); /* place them once, without waiting for a pan */
          })
          .catch(() => hud(`cannot read ${HOST_SCENE} item list`, true));
      }

      /* No pan: the same hole changes feed. The item list is re-read rather
         than just re-pushed, because Browser may have been created after this
         page bound and its size is what the crop needs; loadItemIds then
         parks the loser and places the winner. */
      function setBrowserLive(live) {
        if (live === browserLive) return;
        browserLive = live;
        hud(`browser ${live ? "on air" : "off air"}`);
        if (wsReady) loadItemIds({ quiet: true });
      }

      function sendBatch(requests) {
        ws.send(
          JSON.stringify({
            op: 8,
            d: {
              requestId: "b" + ++reqId,
              haltOnFailure: false,
              executionType: 0,
              requests,
            },
          }),
        );
      }

      /* Fill a WxH opening from a sw x sh source without distortion, by
         cropping the source to the opening's aspect and then stretching.

         SCALE_OUTER would do the same fit, but it renders the whole frame and
         lets the excess spill outside the bounds box. The mask hides spill
         that lands on comic art — and does nothing about spill that lands in
         ANOTHER punched hole. On CHAT that put the chat browser's overspill
         straight across the webcam bleeding in from the cam panel, filling
         half that window with the wrong source. Cropping first means an item
         paints nothing outside its own opening, ever. */
      function fillTransform(r, s) {
        const t = {
          positionX: r.x,
          positionY: r.y,
          alignment: 5 /* top-left, so position IS the rect corner */,
          rotation: 0,
          boundsAlignment: 0,
          boundsWidth: Math.max(1, r.w),
          boundsHeight: Math.max(1, r.h),
        };

        /* No frame yet, so no size to crop against. SCALE_OUTER still fills
           the opening; it just spills until the size is known. */
        if (!s) {
          t.boundsType = "OBS_BOUNDS_SCALE_OUTER";
          /* A crop left over from the last time this source DID have a size
             would still apply, and SCALE_OUTER would fit the cropped frame —
             zoomed in on a slice of it. */
          t.cropLeft = t.cropRight = t.cropTop = t.cropBottom = 0;
          return t;
        }

        const want = Math.max(1, r.w) / Math.max(1, r.h);
        let cx = 0,
          cy = 0;
        if (s.w / s.h > want) cx = Math.round((s.w - s.h * want) / 2);
        else cy = Math.round((s.h - s.w / want) / 2);

        /* OBS rejects a crop that leaves nothing, and a 1px rounding error at
           an extreme aspect would do exactly that. */
        cx = Math.min(cx, Math.floor((s.w - 2) / 2));
        cy = Math.min(cy, Math.floor((s.h - 2) / 2));

        t.boundsType = "OBS_BOUNDS_STRETCH";
        t.cropLeft = t.cropRight = Math.max(0, cx);
        t.cropTop = t.cropBottom = Math.max(0, cy);
        return t;
      }

      function pushRects(rects) {
        if (!wsReady || !itemIds.size) return;
        const reqs = [];
        rects.forEach((r) => {
          if (!punched.has(r.hole)) return;
          const src = feed(r.src);
          const id = itemIds.get(src);
          if (!id) return;
          reqs.push({
            requestType: "SetSceneItemTransform",
            requestData: {
              sceneName: HOST_SCENE,
              sceneItemId: id,
              sceneItemTransform: fillTransform(r, srcSize.get(src)),
            },
          });
        });
        if (reqs.length) sendBatch(reqs);
      }

      /* Sources the live panel does not use are parked wholly outside the
         canvas, not switched off.

         Disabling the item deactivates the source, and reactivating it is not
         free: a game capture has to re-hook its target and a capture device
         has to reopen the device, which is anywhere from a few hundred ms to
         a couple of seconds of black the next time that hole is punched.
         CHAT is the only view that drops Game — its camera starts past
         x=3490 and the game panel ends at 3464 — so every switch out of chat
         paid for a re-hook. CAM drops it too. That is the black leaving chat;
         the skirt above is the black arriving.

         Parked items stay hooked, keep feeding Source Record, and still
         cannot show through a hole they do not own: top-left alignment at
         canvas + 200 puts every pixel off-canvas. Enable is only sent for an
         item actually seen disabled, so a source switched off by hand comes
         back once instead of being fought over on every pan. Only sources
         this overlay owns are touched — anything else in COMIC, Overlay
         included, is left alone. */
      const PARK = {
        positionX: CANVAS_W + 200,
        positionY: CANVAS_H + 200,
        alignment: 5,
        rotation: 0,
        boundsType: "OBS_BOUNDS_STRETCH",
        boundsAlignment: 0,
        boundsWidth: 16,
        boundsHeight: 9,
      };

      function syncVisibility() {
        if (!wsReady || !itemIds.size) return;
        const used = new Set([...punched].map((h) => feed(h.src)));
        const reqs = [];
        itemIds.forEach((id, name) => {
          if (!managed.has(name) && name !== BROWSER) return;
          if (itemOn.get(name) === false) {
            reqs.push({
              requestType: "SetSceneItemEnabled",
              requestData: {
                sceneName: HOST_SCENE,
                sceneItemId: id,
                sceneItemEnabled: true,
              },
            });
            itemOn.set(name, true);
          }
          if (!used.has(name))
            reqs.push({
              requestType: "SetSceneItemTransform",
              requestData: {
                sceneName: HOST_SCENE,
                sceneItemId: id,
                sceneItemTransform: PARK,
              },
            });
        });
        if (reqs.length) sendBatch(reqs);
      }

      /* ================================================================
   DEBUG HUD — ?debug=1
   ================================================================ */
      const hudEl = document.getElementById("hud"),
        hudState = document.getElementById("hudState"),
        hudRects = document.getElementById("hudRects"),
        hudLog = document.getElementById("hudLog");
      const hudLines = [];

      function hud(msg, warn) {
        if (!DEBUG) return;
        const t = new Date().toTimeString().slice(0, 8);
        hudLines.push(
          `<span class="${warn ? "warn" : ""}">${t}  ${msg}</span>`,
        );
        while (hudLines.length > 8) hudLines.shift();
        hudLog.innerHTML = hudLines.join("\n");
        paintState();
      }

      function paintState() {
        hudState.textContent =
          `scene   ${currentScene || "—"}\n` +
          `panel   ${current || "—"}\n` +
          `socket  ${wsReady ? "identified" : "down"}\n` +
          `items   ${itemIds.size ? [...itemIds.keys()].join(" ") : "—"}\n` +
          `obsapi  ${window.obsstudio ? "present" : "absent"}\n`;
      }

      function paintRects(rects) {
        hudRects.innerHTML =
          "\n" +
          rects
            .map(
              (r) =>
                `<span class="${r.visible ? "" : "off"}">` +
                `${r.key.padEnd(12)}` +
                `x:${r.x.toFixed(0).padStart(6)} y:${r.y.toFixed(0).padStart(6)} ` +
                `w:${r.w.toFixed(0).padStart(5)} h:${r.h.toFixed(0).padStart(5)} ` +
                `${r.visible ? "SEND" : "skip"}</span>`,
            )
            .join("\n") +
          "\n";
      }

      if (DEBUG) {
        hudEl.removeAttribute("hidden");
        paintState();
        hud(
          `overlay up — ${window.obsstudio ? "inside OBS" : "plain browser"}`,
        );
        /* Keys 1-9 for testing outside OBS. There is no keyboard in a
           browser source, so this is dead weight on a live overlay. */
        document.addEventListener("keydown", (e) => {
          const n = Number(e.key);
          if (n >= 1 && n <= PANELS.length) goTo(String(n));
        });
      }
    </script>
  </body>
</html>
