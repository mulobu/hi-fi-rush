<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Comic Page Overlay — OBS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bangers&family=Permanent+Marker&family=Caveat:wght@600;700&family=Baloo+2:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ============================================================
   TOKENS
   ============================================================ */
      :root {
        --ink: #16161d;
        --gutter: #aebcc9;
        --yellow: #f5d030;
        --marker: #d93028;
        --peri: #b9c3d6;
        --navy: #3b4a9e;
        --cyan: #35d6e8;
        --paper: #f4f1e8;
        --mint: #3fb98a;
        --plum: #6b3f8f;

        --canvas-w: 1920px;
        --canvas-h: 1080px;
        --page-w: 7680px;
        --page-h: 4320px;
        /* How far the gutter overhangs the page. It must exceed the worst
           bleed DURING a pan, not at rest. Resting worst is chat at 1672 page
           px, which is what the old 2000 was sized for, and it was wrong: a
           transition interpolates the transform components independently, so
           the camera passes through views wider than either endpoint, and the
           overshoot easing carries it ~4.8% past the target on top of that.
           Stepping every ordered pair through the real easing peaks at
           cam -> chat, 2187 page px at 550ms in — 187 past the old skirt, a
           54px band of bare canvas along the frame edge on every switch into
           CHAT. 2500 clears every pan; 3000 is headroom, and a whole number
           of 30px halftone tiles so the skirt's dots stay in phase with the
           page's. */
        --page-skirt: 3000px;

        --beat-ms: 500ms;
        --pan-ms: 980ms;
        --snap: cubic-bezier(0.32, 1.38, 0.48, 1);

        --f-display: "Bangers", "Arial Black", sans-serif;
        --f-marker: "Permanent Marker", cursive;
        --f-scrawl: "Caveat", cursive;
        --f-body: "Baloo 2", system-ui, sans-serif;

        --wobble: 240px 18px 200px 22px / 20px 210px 24px 230px;
        --wobble-sm: 80px 8px 70px 10px / 9px 74px 11px 78px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        /* Transparent, so a dead browser source degrades to whatever OBS
           has behind it rather than a white box. See CLAUDE.md §6. */
        background: transparent;
        font-family: var(--f-body);
        color: var(--paper);
        overflow: hidden;
        width: var(--canvas-w);
        height: var(--canvas-h);
      }

      /* ============================================================
   FRAME — the viewport IS the OBS canvas.

   Nothing scales it. 1px here is 1px in OBS, which is the whole
   reason getBoundingClientRect() can be handed straight to
   SetSceneItemTransform with no conversion.
   ============================================================ */
      .viewport {
        position: fixed;
        top: 0;
        left: 0;
        width: var(--canvas-w);
        height: var(--canvas-h);
        overflow: hidden;
        /* Transparent: the punched holes must reach OBS, not stop here. The
           gutter this used to paint is now the skirt on .page below, which
           keeps the same colour but sits inside the mask. */
        background: transparent;
      }
      .shaker {
        position: absolute;
        inset: 0;
      }
      .shaker.shake {
        animation: shake 180ms steps(3, end);
      }
      @keyframes shake {
        0% {
          transform: translate(0, 0);
        }
        30% {
          transform: translate(-9px, 6px);
        }
        60% {
          transform: translate(7px, -7px);
        }
        100% {
          transform: translate(0, 0);
        }
      }

      .page {
        position: absolute;
        top: 0;
        left: 0;
        width: var(--page-w);
        height: var(--page-h);
        transform-origin: 0 0;
        transition: transform var(--pan-ms) var(--snap);
        will-change: transform;
        /* Deliberately paints nothing. A mask applies to the whole subtree, so
           anything painted here could only be cut by punching holes through
           every panel, tag and border as well. .page-under carries the paint
           instead, as a sibling of the panels rather than their ancestor. */
      }
      /* Gutter and halftone, in five elements that look like one surface.

         .page-under is the page itself and carries the cuts. The skirt — the
         overhang that makes a fitted panel show gutter past the page edge
         rather than webcam — is four bands AROUND that rectangle: top, bottom,
         left, right. They meet its edges and never lie over it.

         The band that must not exist is a single inset rectangle. It would
         cover the page as well as the overhang, and being unmasked it would
         seal every cut in .page-under back up: no video, anywhere. The reason
         to split at all is that only the page can contain a cut, so only the
         page needs a mask — and a mask forces its own composited layer, so
         one inset element would have put 13680 x 10320, 4x the page's area,
         through the compositor on every frame of a pan.

         Phase: the halftone tiles at 30px, and the page (7680 x 4320) and the
         skirt (3000) are all whole numbers of tiles, so every band's origin
         lands on the same grid as the page's and the seams are invisible. */
      .skirt-n,
      .skirt-s,
      .skirt-w,
      .skirt-e {
        position: absolute;
        background: var(--gutter);
      }
      .skirt-n,
      .skirt-s {
        left: calc(-1 * var(--page-skirt));
        right: calc(-1 * var(--page-skirt));
        height: var(--page-skirt);
      }
      .skirt-n {
        top: calc(-1 * var(--page-skirt));
      }
      .skirt-s {
        top: 100%;
      }
      .skirt-w,
      .skirt-e {
        top: 0;
        height: var(--page-h);
        width: var(--page-skirt);
      }
      .skirt-w {
        left: calc(-1 * var(--page-skirt));
      }
      .skirt-e {
        left: 100%;
      }
      .page-under {
        position: absolute;
        inset: 0;
        background: var(--gutter);
      }
      .skirt-n::before,
      .skirt-s::before,
      .skirt-w::before,
      .skirt-e::before,
      .page-under::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: radial-gradient(var(--ink) 32%, transparent 33%);
        background-size: 30px 30px;
        opacity: 0.1;
      }

      /* ============================================================
   PANELS
   ============================================================ */
      .panel {
        position: absolute;
        overflow: hidden;
        cursor: pointer;
        border: 15px solid var(--ink);
        border-radius: var(--wobble);
        box-shadow: 22px 22px 0 rgba(22, 22, 29, 0.55);
      }
      /* On .under, not .panel: .panel is never masked, so a halftone there
         would tile straight over the live video inside every hole. Same box
         either way — .under fills the panel's padding box. */
      .under::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: radial-gradient(
          rgba(22, 22, 29, 0.85) 30%,
          transparent 31%
        );
        background-size: 26px 26px;
        opacity: 0.18;
        mix-blend-mode: multiply;
      }

      /* HOLES — transparent windows. One OBS source sits behind each. */
      .hole {
        position: absolute;
        background: transparent;
        overflow: hidden;
        border: 11px solid var(--ink);
        border-radius: var(--wobble-sm);
        box-shadow: 12px 12px 0 rgba(22, 22, 29, 0.6);
      }
      .hole.bare {
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
      /* Everything that sits BENEATH the holes. The only masked part of a
         panel — see HOLE PUNCH. Carries the panel's background, moved off
         .panel at build time so the panel itself paints nothing behind a
         hole. */
      .under {
        position: absolute;
        inset: 0;
      }
      /* What a hole shows when it could not claim its source — which is the
         normal state for every neighbouring panel bleeding into frame, not an
         error. Translucent on purpose: an unpunched hole is not masked, so the
         panel's own art is still behind it and this shades that art into a
         drawn window instead of covering it with a mud-coloured box. */
      .fake-source {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: repeating-linear-gradient(
          45deg,
          rgba(22, 22, 29, 0.34) 0 40px,
          rgba(22, 22, 29, 0.14) 40px 80px
        );
      }
      /* The source name is scaffolding for the mockup. On air it is a word
         printed across the art in a panel nobody is looking at. */
      .src-label {
        display: none;
      }
      /* A punched hole is a real window. Any hole that could not claim its
         source keeps the drawn placeholder, so it reads as comic art rather
         than a transparent gap with nothing behind it. */
      .hole.punched .fake-source {
        display: none;
      }
      .src-label {
        font-family: var(--f-body);
        font-weight: 800;
        font-size: 44px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.5);
        text-align: center;
        padding: 0 24px;
      }

      /* tags */
      .panel-tag {
        position: absolute;
        bottom: 32px;
        left: 32px;
        background: var(--ink);
        color: var(--paper);
        font-family: var(--f-display);
        font-size: 50px;
        letter-spacing: 0.06em;
        padding: 8px 24px 4px;
        transform: rotate(-1.2deg);
        box-shadow: 11px 11px 0 var(--marker);
        pointer-events: none;
        z-index: 8;
        animation: tagPulse var(--beat-ms) var(--snap) infinite;
      }
      @keyframes tagPulse {
        0% {
          transform: rotate(-1.2deg) scale(1.045);
        }
        45%,
        100% {
          transform: rotate(-1.2deg) scale(1);
        }
      }
      .panel.is-live .panel-tag {
        box-shadow: 11px 11px 0 var(--cyan);
      }

      /* shared decorations */
      .speedlines {
        position: absolute;
        inset: -30%;
        pointer-events: none;
        background: repeating-conic-gradient(
          from 0deg at 50% 50%,
          rgba(22, 22, 29, 0.3) 0deg 1deg,
          transparent 1deg 3.4deg
        );
        animation: spin 42s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .rays {
        position: absolute;
        inset: -40%;
        pointer-events: none;
        background: repeating-conic-gradient(
          from 0deg at 50% 50%,
          rgba(255, 255, 255, 0.3) 0deg 4deg,
          transparent 4deg 11deg
        );
        animation: spin 26s linear infinite reverse;
      }

      .bubble {
        position: absolute;
        background: var(--paper);
        border: 10px solid var(--ink);
        border-radius: var(--wobble-sm);
        padding: 18px 30px;
        font-family: var(--f-body);
        font-weight: 700;
        color: var(--ink);
        z-index: 7;
      }
      .bubble::after {
        content: "";
        position: absolute;
        bottom: -52px;
        left: 44px;
        border: 26px solid transparent;
        border-top-color: var(--ink);
      }

      .stamp {
        position: absolute;
        display: grid;
        place-items: center;
        font-family: var(--f-display);
        color: var(--yellow);
        -webkit-text-stroke: 12px var(--ink);
        paint-order: stroke fill;
        z-index: 7;
        animation: stampPulse calc(var(--beat-ms) * 2) var(--snap) infinite;
      }
      @keyframes stampPulse {
        0% {
          transform: rotate(-9deg) scale(1.14);
        }
        30%,
        100% {
          transform: rotate(-9deg) scale(0.96);
        }
      }

      .scrawl {
        position: absolute;
        font-family: var(--f-scrawl);
        font-weight: 700;
        color: var(--marker);
        z-index: 7;
        pointer-events: none;
      }

      /* SOCIALS — paper cut-outs taped to every scene panel.

         Sized in CANVAS px through --u, which the build sets to 1 / the
         panel's resting scale. Panels land anywhere from 0.33x (chat) to
         1.17x (cam), so page-px sizes would make the handle 3.5x bigger on
         one scene than another. Always lifted `over`: on game the whole panel
         is a hole, and under-art there would be painted over by the capture. */
      .socials {
        position: absolute;
        z-index: 7;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: calc(var(--u) * 8px);
        pointer-events: none;
      }
      .socials.row {
        flex-direction: row;
        align-items: center;
        gap: calc(var(--u) * 26px);
      }
      /* Two lines: the first two labels side by side, the third under them. */
      .soc-line {
        display: flex;
        align-items: center;
        gap: calc(var(--u) * 26px);
      }
      .soc-row {
        display: flex;
        align-items: center;
      }
      .socials .cut {
        width: calc(var(--u) * 82px);
        height: calc(var(--u) * 82px);
        margin-right: calc(var(--u) * -10px);
        filter: drop-shadow(
          calc(var(--u) * 5px) calc(var(--u) * 5px) 0 rgba(22, 22, 29, 0.55)
        );
        transform: rotate(var(--r, 0deg));
        animation: cutBob calc(var(--beat-ms) * 2) var(--snap) infinite;
      }
      .socials .cut:nth-child(1) {
        --r: -6deg;
      }
      .socials .cut:nth-child(2) {
        --r: 4deg;
        animation-delay: calc(var(--beat-ms) * -1.5);
      }
      .socials .cut:nth-child(3) {
        --r: -3deg;
        animation-delay: calc(var(--beat-ms) * -1);
      }
      @keyframes cutBob {
        0% {
          transform: rotate(var(--r, 0deg)) scale(1.1);
        }
        30%,
        100% {
          transform: rotate(var(--r, 0deg)) scale(1);
        }
      }
      /* Over live video nothing animates (§2) — the game panel is all hole. */
      .p-game .socials .cut {
        animation: none;
      }
      /* drop-shadow on the wrapper, because clip-path on the label clips
         any shadow the label casts itself. */
      .handle {
        margin-left: calc(var(--u) * 16px);
        filter: drop-shadow(
          calc(var(--u) * 5px) calc(var(--u) * 5px) 0 rgba(22, 22, 29, 0.55)
        );
      }
      .handle span {
        display: block;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--f-body);
        font-weight: 800;
        font-size: calc(var(--u) * 34px);
        line-height: 1;
        padding: calc(var(--u) * 12px) calc(var(--u) * 20px)
          calc(var(--u) * 7px);
        white-space: nowrap;
        transform: rotate(-2deg);
        /* Scissor-cut, not torn: straight facets at odd angles. */
        clip-path: polygon(
          0 8%, 22% 0, 51% 6%, 78% 0, 100% 5%,
          98% 52%, 100% 94%, 70% 100%, 38% 95%, 9% 100%, 1% 90%, 2% 48%
        );
      }
      .soc-row + .soc-row .handle span {
        transform: rotate(1.5deg);
      }

      /* ============================================================
   PANEL 1 — STREAM START
   ============================================================ */
      .p-start {
        background: var(--plum);
      }
      .p-start .big {
        position: absolute;
        left: 5%;
        top: 14%;
        font-family: var(--f-display);
        font-size: 300px;
        line-height: 0.82;
        color: var(--yellow);
        -webkit-text-stroke: 14px var(--ink);
        paint-order: stroke fill;
        transform: rotate(-2deg);
      }
      .p-start .clock {
        position: absolute;
        left: 6%;
        top: 62%;
        font-family: var(--f-display);
        font-size: 190px;
        color: var(--paper);
        -webkit-text-stroke: 10px var(--ink);
        paint-order: stroke fill;
        letter-spacing: 0.06em;
      }
      .p-start .scrawl {
        left: 5%;
        top: 6%;
        font-size: 110px;
        transform: rotate(-4deg);
      }

      /* ============================================================
   PANEL 3 — GAMEPLAY
   ============================================================ */
      .p-game {
        background: var(--ink);
      }

      /* ============================================================
   PANEL 4 — FULL CAM
   ============================================================ */
      .p-cam {
        background: var(--mint);
      }

      /* ============================================================
   PANEL 5 — BRB
   ============================================================ */
      .p-brb {
        background: var(--marker);
      }
      .p-brb .big {
        position: absolute;
        left: 4%;
        top: 16%;
        font-family: var(--f-display);
        font-size: 260px;
        line-height: 0.8;
        color: var(--yellow);
        -webkit-text-stroke: 14px var(--ink);
        paint-order: stroke fill;
        transform: rotate(-2.4deg);
      }
      /* Where the mascot lands. Same box the Cam hole used to occupy, drawn
         rather than punched — the taped-on photo inset the art direction
         already calls for, and a plate the mascot's transparency can read
         against instead of live video. */
      .p-brb .mascot-frame {
        position: absolute;
        left: 70%;
        top: 16%;
        width: 26%;
        height: 62%;
        border: 11px solid var(--ink);
        border-radius: var(--wobble-sm);
        background:
          repeating-linear-gradient(
            -18deg,
            rgba(255, 255, 255, 0.16) 0 26px,
            transparent 26px 84px
          ),
          var(--peri);
        box-shadow: 12px 12px 0 rgba(22, 22, 29, 0.6);
      }
      .p-brb .tape {
        position: absolute;
        width: 150px;
        height: 46px;
        background: rgba(244, 241, 232, 0.72);
        border: 3px solid rgba(22, 22, 29, 0.35);
      }
      .p-brb .tape.l {
        left: -46px;
        top: -18px;
        transform: rotate(-32deg);
      }
      .p-brb .tape.r {
        right: -46px;
        bottom: -18px;
        transform: rotate(-32deg);
      }

      /* ============================================================
   PANEL 6 — STREAM END
   ============================================================ */
      .p-end {
        background: var(--navy);
      }
      .p-end .big {
        position: absolute;
        left: 4%;
        top: 12%;
        font-family: var(--f-display);
        font-size: 190px;
        line-height: 0.82;
        color: var(--paper);
        -webkit-text-stroke: 12px var(--ink);
        paint-order: stroke fill;
        transform: rotate(-1.4deg);
      }
      .p-end .rank {
        right: 26%;
        top: 12%;
        width: 340px;
        height: 340px;
        font-size: 280px;
        line-height: 1;
      }
      /* bottom clears the panel tag, which is 32px up from the panel edge and
         about 70px tall — at 8% the last credit line ran straight under it. */
      .credits {
        position: absolute;
        left: 4%;
        bottom: 20%;
        width: 44%;
        height: 30%;
        overflow: hidden;
        z-index: 6;
        /* A roll cut dead flat at both ends reads as clipped text rather than
           as credits. Fades to nothing instead. */
        mask-image: linear-gradient(
          transparent 0%,
          #000 16%,
          #000 84%,
          transparent 100%
        );
        -webkit-mask-image: linear-gradient(
          transparent 0%,
          #000 16%,
          #000 84%,
          transparent 100%
        );
      }
      .credits ul {
        position: absolute;
        list-style: none;
        animation: roll 14s linear infinite;
      }
      .credits li {
        font-family: var(--f-body);
        font-weight: 700;
        font-size: 58px;
        color: var(--paper);
        opacity: 0.85;
        padding: 6px 0;
        white-space: nowrap;
      }
      @keyframes roll {
        from {
          transform: translateY(0);
        }
        to {
          transform: translateY(-50%);
        }
      }

      /* ============================================================
   PANEL 2 — CHAT
   ============================================================ */
      .p-chat {
        background: var(--peri);
      }
      .p-chat .header {
        position: absolute;
        top: 30px;
        left: 30px;
        right: 30px;
        background: var(--ink);
        color: var(--yellow);
        font-family: var(--f-display);
        font-size: 96px;
        letter-spacing: 0.1em;
        padding: 14px 30px 8px;
        transform: rotate(-0.8deg);
        text-align: center;
        z-index: 7;
      }

      /* ============================================================
   ART PANELS
   ============================================================ */
      .p-board {
        background: var(--yellow);
      }
      .p-board .ink-circle {
        position: absolute;
        left: 7%;
        top: 26%;
        width: 50%;
        height: 38%;
        border: 13px solid var(--ink);
        border-radius: 50%;
        transform: rotate(-6deg);
      }
      .p-board .title {
        position: absolute;
        left: 12%;
        top: 33%;
        font-family: var(--f-marker);
        font-size: 190px;
        color: var(--marker);
        transform: rotate(-4deg);
      }
      .p-board .note {
        left: 30%;
        top: 64%;
        font-size: 130px;
        transform: rotate(-11deg);
      }
      .p-board .photo {
        position: absolute;
        border: 11px solid var(--ink);
        background: var(--peri);
        border-radius: var(--wobble-sm);
        display: grid;
        place-items: center;
        font-family: var(--f-display);
        font-size: 110px;
        color: var(--ink);
      }
      .p-board svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .p-board .dash {
        fill: none;
        stroke: var(--ink);
        stroke-width: 1.2;
        stroke-dasharray: 4 3;
        animation: march 2s linear infinite;
      }
      @keyframes march {
        to {
          stroke-dashoffset: -14;
        }
      }

      .p-np {
        background: var(--navy);
      }
      .np-label {
        position: absolute;
        top: 36px;
        left: 36px;
        font-family: var(--f-display);
        font-size: 70px;
        color: var(--yellow);
        letter-spacing: 0.08em;
      }
      .np-track {
        position: absolute;
        top: 140px;
        left: 36px;
        right: 36px;
        font-family: var(--f-body);
        font-weight: 700;
        font-size: 54px;
        color: var(--paper);
        opacity: 0.85;
      }
      .eq {
        position: absolute;
        bottom: 56px;
        left: 36px;
        right: 36px;
        height: 260px;
        display: flex;
        align-items: flex-end;
        gap: 15px;
      }
      .eq i {
        flex: 1;
        background: var(--cyan);
        display: block;
        height: 30%;
        animation: eqb var(--beat-ms) var(--snap) infinite;
      }
      .eq i:nth-child(2n) {
        animation-duration: calc(var(--beat-ms) * 2);
      }
      .eq i:nth-child(3n) {
        animation-duration: calc(var(--beat-ms) / 2);
        background: var(--yellow);
      }
      @keyframes eqb {
        0% {
          height: 100%;
        }
        60%,
        100% {
          height: 22%;
        }
      }

      .p-alert {
        background: var(--peri);
      }
      .p-alert .burst {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-family: var(--f-display);
        font-size: 220px;
        color: var(--yellow);
        -webkit-text-stroke: 14px var(--ink);
        paint-order: stroke fill;
        z-index: 6;
        animation: stampPulse calc(var(--beat-ms) * 2) var(--snap) infinite;
      }

      /* ============================================================
   DEBUG HUD — ?debug=1 only. Never rendered on a live overlay.
   ============================================================ */
      .hud {
        position: absolute;
        right: 14px;
        top: 14px;
        max-width: 720px;
        background: rgba(5, 5, 10, 0.93);
        border: 2px solid var(--cyan);
        padding: 11px 13px;
        font-family: ui-monospace, Menlo, monospace;
        font-size: 12px;
        line-height: 1.55;
        color: var(--cyan);
        z-index: 60;
        pointer-events: none;
        white-space: pre;
      }
      .hud h4 {
        font-family: var(--f-display);
        font-size: 15px;
        letter-spacing: 0.14em;
        color: var(--yellow);
        margin-bottom: 6px;
      }
      .hud .off {
        color: #4a4a55;
      }
      .hud .warn {
        color: var(--yellow);
      }
      .hud[hidden] {
        display: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .page {
          transition-duration: 0.01ms;
        }
        .beat-dot,
        .panel-tag,
        .eq i,
        .stamp,
        .speedlines,
        .rays,
        .dash,
        .cat,
        .credits ul,
        .socials .cut,
        .p-alert .burst {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="viewport" id="viewport">
      <div class="shaker" id="shaker"><div class="page" id="page"></div></div>
    </div>

    <div class="hud" id="hud" hidden>
      <h4>OVERLAY DEBUG</h4>
      <div id="hudState"></div>
      <div id="hudRects"></div>
      <div id="hudLog"></div>
    </div>

    <script src="../../core/contract.js"></script>
    <script src="../../core/base.js"></script>
    <script>
      const PAGE_W = 7680,
        PAGE_H = 4320,
        CANVAS_W = 1920,
        CANVAS_H = 1080;

      /* ================================================================
   PANEL CONFIG — single source of truth.

   holes[] are transparent windows inside a panel. Each maps to one
   OBS source by name. Coordinates are PERCENTAGES of the panel, so
   art and hole can never drift apart when a panel is resized.
   ================================================================ */
      const PANELS = [
        {
          id: 1,
          key: "start",
          cls: "p-start",
          fit: "fit",
          x: 64,
          y: 64,
          w: 2360,
          h: 1180,
          rot: -1.0,
          tag: "STREAM START",
          /* Above the webcam window, clear of the scrawl on the left. */
          socials: { at: "right:4%;top:6%", layout: "pair" },
          holes: [
            /* 38 × 42.8 of 2360 × 1180 is 897 × 505 — 16:9 to within a pixel,
               so fillTransform crops almost nothing off the webcam. The square
               window that used to sit here held the standby loop, which was
               dropped: a starting-soon screen wants your face, and a second
               video source existed only to fill this one hole. */
            {
              src: "Cam",
              x: 58,
              y: 28,
              w: 38,
              h: 42.8,
              label: "Webcam",
              c: "#4a3a1e",
            },
          ],
        },

        {
          id: 2,
          key: "chat",
          cls: "p-chat",
          fit: "fit",
          x: 5200,
          y: 64,
          w: 2416,
          h: 3188,
          rot: 0.8,
          tag: "CHAT",
          /* In the gutter, not the panel: at 0.33x the portrait panel has no
             strip wide enough for a handle, and leaves 563 canvas px of empty
             page either side. Page px, top-right of that gutter; the mascot
             holds the bottom-right (placement.json CHAT, y 681-1081). */
          socials: { page: { x: 7747, y: 289 }, size: 0.9 },
          holes: [
            {
              src: "Chat",
              x: 5,
              y: 12,
              w: 90,
              h: 80,
              label: "Chat browser",
              c: "#243a2e",
            },
          ],
        },

        {
          id: 3,
          key: "game",
          cls: "p-game",
          fit: "fill",
          x: 64,
          y: 1292,
          w: 3400,
          h: 1960,
          rot: 0.5,
          tag: "GAMEPLAY",
          /* Bottom strip between the mascot (canvas x 31-391) and the Cam
             window (from 70%). Over the capture, so it keeps to the edge. */
          socials: { at: "left:21.5%;bottom:3%", layout: "pair", size: 0.93 },
          speedlines: true,
          holes: [
            {
              src: "Game",
              x: 0,
              y: 0,
              w: 100,
              h: 100,
              bare: true,
              label: "Game capture",
              c: "#1e3a2e",
            },
            {
              src: "Cam",
              x: 70,
              y: 60,
              w: 27,
              h: 35,
              label: "Cam",
              c: "#4a3a1e",
            },
          ],
        },

        {
          id: 4,
          key: "cam",
          cls: "p-cam",
          fit: "fill",
          x: 3512,
          y: 1292,
          w: 1640,
          h: 956,
          rot: -1.4,
          tag: "FULL CAM",
          /* Straddles the bottom of the window frame — the mint strip under
             it is ~70 canvas px once fill crops it. */
          socials: { at: "right:5%;bottom:1%", layout: "row", size: 0.9 },
          rays: true,
          holes: [
            {
              src: "Cam",
              x: 6,
              y: 8,
              w: 88,
              h: 84,
              label: "Webcam",
              c: "#4a3a1e",
            },
          ],
        },

        {
          id: 5,
          key: "brb",
          cls: "p-brb",
          fit: "fit",
          x: 64,
          y: 3300,
          w: 2360,
          h: 956,
          rot: 1.1,
          tag: "BRB",
          /* Under BE RIGHT BACK, left of the mascot frame (from 70%). */
          socials: { at: "left:4%;top:64%", layout: "pair" },
          /* No holes. The webcam window that used to sit at 70%,16%,26%,62%
             is now the mascot's spot — see .p-brb .mascot-frame, and the BRB
             entry in mascot/placement.json that lands the deer inside it.
             A hole here would also have claimed the single Cam item away
             from the game panel bleeding into frame above. */
          holes: [],
        },

        {
          id: 6,
          key: "end",
          cls: "p-end",
          fit: "fit",
          x: 2472,
          y: 3300,
          w: 2680,
          h: 956,
          rot: -0.6,
          tag: "STREAM END",
          /* Under the webcam, right of the tag. */
          socials: { at: "right:4%;bottom:3%", layout: "row" },
          holes: [
            {
              src: "Cam",
              x: 74,
              y: 14,
              w: 22,
              h: 66,
              label: "Cam",
              c: "#4a3a1e",
            },
          ],
        },

        {
          id: 7,
          key: "board",
          cls: "p-board",
          fit: "fit",
          x: 2472,
          y: 64,
          w: 2680,
          h: 1180,
          rot: 0.7,
          tag: "INTEL",
          holes: [],
        },

        {
          id: 8,
          key: "np",
          cls: "p-np",
          fit: "fit",
          x: 5200,
          y: 3300,
          w: 2416,
          h: 956,
          rot: 1.3,
          tag: "NOW PLAYING",
          holes: [],
        },

        {
          id: 9,
          key: "alert",
          cls: "p-alert",
          fit: "fit",
          x: 3512,
          y: 2296,
          w: 1640,
          h: 956,
          rot: 1.6,
          tag: "ALERTS",
          holes: [],
        },
      ];

      /* Scene name -> the panel it pans to. Scenes UPPERCASE, sources
         TitleCase — OBS shares one namespace. The names are the contract's;
         which panel each one shows is this page's. */
      const SCENE_MAP = {
        START: 1,
        CHAT: 2,
        GAME: 3,
        CAM: 4,
        BRB: 5,
        END: 6,
      };

      /* The panel's resting scale — what transformFor() lands it at. */
      function scaleFor(p) {
        const sx = CANVAS_W / p.w,
          sy = CANVAS_H / p.h;
        return p.fit === "fill" ? Math.max(sx, sy) : Math.min(sx, sy) * 0.97;
      }

      /* Beat from a shared wall-clock epoch — no sync messages, ever. */
      const BPM = 120,
        BEAT_MS = 60000 / BPM,
        EPOCH = 0;
      const beatPhase = () => ((Date.now() - EPOCH) % BEAT_MS) / BEAT_MS;

      /* ================================================================
   PANEL ART
   ================================================================ */
      function artFor(p) {
        switch (p.key) {
          case "start":
            return `
      <div class="rays"></div>
      <div class="scrawl">get comfy</div>
      <div class="big">STAND<br>BY</div>
      <div class="clock" id="countdown">05:00</div>`;
          case "chat":
            return `<div class="header">CHAT</div>`;
          case "cam":
            return `<div class="rays"></div>`;
          case "brb":
            /* The frame is empty on purpose: the mascot browser source sits
               above this overlay in COMIC and paints into it. Drawn, not
               punched — a hole would be a transparent rectangle, and the
               mascot's own transparency needs comic art behind it. */
            return `
      <div class="big">BE RIGHT<br>BACK</div>
      <div class="mascot-frame"><span class="tape l"></span><span class="tape r"></span></div>
      <div class="bubble over" style="right:4%;top:4%;font-size:64px">back soon</div>`;
          case "end":
            return `
      <div class="big">MISSION<br>COMPLETE</div>
      <div class="stamp rank">S</div>
      <div class="credits"><ul>
        <li>thanks for watching</li><li>chat MVP — you</li>
        <li>mascot — the deer</li>
        <li>thanks for watching</li><li>chat MVP — you</li>
        <li>mascot — the deer</li>
      </ul></div>`;
          case "board":
            return `
      <div class="ink-circle"></div>
      <div class="title">INTEL</div>
      <div class="scrawl note">insider?</div>
      <div class="photo" style="left:63%;top:8%;width:22%;height:46%">?</div>
      <div class="photo" style="left:70%;top:60%;width:19%;height:32%">!</div>
      <svg viewBox="0 0 100 100" preserveAspectRatio="none">
        <path class="dash" d="M 54 46 L 74 70"/><path class="dash" d="M 52 28 L 68 24"/>
      </svg>`;
          case "np":
            return `
      <div class="np-label">NOW PLAYING</div>
      <div class="np-track">Untitled Sample — 120 BPM</div>
      <div class="eq">${"<i></i>".repeat(14)}</div>`;
          case "alert":
            return `<div class="burst">BAM!</div>`;
          default:
            return "";
        }
      }

    </script>
    <script src="../../core/socials.js"></script>
    <script src="../../core/panel-page.js"></script>
    <script src="../../core/obs-link.js"></script>

    <script src="../../core/hud.js"></script>
    <script>
      /* ================================================================
   BOOT — after every core file, so nothing below can reach a
   declaration that has not been evaluated yet.
   ================================================================ */
      const PAGE = mainPage("overlay");
      applyPunch(-1); /* nothing live yet — page fully opaque */
      listenObsStudio();
      seedFromObsStudio(0);
      connect();
      startHud();
    </script>
  </body>
