<!doctype html>
<meta charset="utf-8">
<title>mascot</title>
<!--
  mascot.html -- a cursor-following sprite, as a standalone OBS browser source.

  Knows nothing about overlay.html and shares nothing with it. Drop it in any
  scene, point it at any sprite set built by tools/hero-asset.py.

    http://127.0.0.1:4460/mascot/mascot.html?set=deer&overlay=hi-fi-rush
    http://127.0.0.1:4460/mascot/mascot.html?set=deer&place=off&anchor=bottom-left&size=280
    http://127.0.0.1:4460/mascot/mascot.html?set=deer&overlay=hi-fi-rush&debug=1

  The bridge serves the repo root. Sprite sets are shared, in sets/ next to
  this file; placement belongs to the overlay, in overlays/<name>/mascot/.

  It also follows OBS scenes. placement.json maps a scene name to a spot in
  camera space; on a scene change the mascot walks to that spot, and hides on
  any scene the file does not name. Scene detection mirrors overlay.html and
  CLAUDE.md §2 -- window.obsstudio first because it survives a dead socket,
  obs-websocket second because getCurrentScene() comes back null at startup in
  a nested browser source and only the socket can seed the first scene.

  Nothing here reads overlay.html, and overlay.html does not know this exists.
  The only shared fact is the OBS scene name.

  Params
    set      sprite set in sets/ next to this file    (default: deer)
    overlay  read placement from overlays/<overlay>/mascot/
    place    placement file in that folder (next to this file without
             `overlay`), or `off` to ignore scenes entirely
                                                      (default: placement.json)
    scene    force a scene name, for testing outside OBS
    host     obs-websocket url             (default: ws://127.0.0.1:4455)
    pw       obs-websocket password
    size     displayed cell height, canvas px         (default: 320)
    anchor   bottom-right | bottom-left | top-right |
             top-left | center                        (default: bottom-right)
    margin   px from the anchored edges               (default: 48)
    x, y     explicit pivot position in canvas px, overrides anchor
    pivot    where the head sits down the cell, 0..1  (default: 0.30)
    ease     0..1 per frame, lower is lazier          (default: 0.18)
    aimease  0..1 target smoothing before follow      (default: 0.22)
    hold     frame hysteresis, fraction of one cell    (default: 0.24)
    maxrate  degrees per second cap                   (default: 900)
    flip     1 to mirror the sprite horizontally      (default: 0)
    dir      clockwise | counterclockwise, overrides manifest
    edit     1 to drag/resize and generate an OBS URL
    debug    1 to show a readout
-->
<style>
  :root { background: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: transparent;
  }
  #mascot {
    position: fixed;
    background-repeat: no-repeat;
    image-rendering: auto;
    opacity: 0;
    /* left/top match the overlay's pan so the mascot travels with the page
       instead of teleporting the instant the scene name changes. Size is not
       transitioned: background-size is set in px and would desync the sprite
       cell mid-flight. */
    transition:
      opacity 220ms ease-out,
      left 980ms cubic-bezier(.32, 1.38, .48, 1),
      top 980ms cubic-bezier(.32, 1.38, .48, 1);
    will-change: background-position, left, top;
  }
  #mascot.ready { opacity: 1; }
  #mascot.offscene { opacity: 0; }
  #mascot.nomove { transition: opacity 220ms ease-out; }
  body.editing #mascot {
    cursor: move;
    outline: 1px dashed rgba(80, 160, 255, .75);
    outline-offset: 4px;
  }
  #hud {
    position: fixed; left: 8px; top: 8px; z-index: 10;
    font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #eaf6ff; background: rgba(8,12,20,.82);
    padding: 8px 10px; border-radius: 4px; white-space: pre;
    display: none;
  }
  #hud.on { display: block; }
  #editor {
    position: fixed; right: 12px; top: 12px; z-index: 20;
    width: 360px; max-width: calc(100vw - 24px);
    font: 13px/1.35 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #edf5ff; background: rgba(12, 16, 24, .9);
    border: 1px solid rgba(255, 255, 255, .16);
    border-radius: 6px; padding: 12px; display: none;
    box-shadow: 0 10px 36px rgba(0, 0, 0, .28);
  }
  body.editing #editor { display: block; }
  #editor .row { display: grid; grid-template-columns: 64px 1fr 52px; gap: 8px; align-items: center; margin: 8px 0; }
  #editor label { color: rgba(237, 245, 255, .82); }
  #editor input[type="range"] { width: 100%; }
  #editor input[type="number"] {
    width: 100%; color: #edf5ff; background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.18); border-radius: 4px; padding: 4px 6px;
  }
  #editor textarea {
    width: 100%; min-height: 76px; resize: vertical; margin-top: 8px;
    color: #edf5ff; background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.18); border-radius: 4px; padding: 8px;
    font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  #editor button {
    appearance: none; border: 1px solid rgba(255,255,255,.2);
    background: rgba(255,255,255,.1); color: #edf5ff;
    border-radius: 4px; padding: 6px 8px; cursor: pointer;
  }
  #editor .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  #editor .hint { color: rgba(237,245,255,.68); font-size: 12px; margin-top: 8px; }
  #editor.copied #copyUrl { background: rgba(60, 170, 110, .35); }
</style>

<div id="mascot"></div>
<div id="hud"></div>
<div id="editor">
  <div class="row">
    <label for="editX">x</label>
    <input id="editX" type="range" min="0" max="1920" step="1">
    <input id="editXNum" type="number" step="1">
  </div>
  <div class="row">
    <label for="editY">y</label>
    <input id="editY" type="range" min="0" max="1080" step="1">
    <input id="editYNum" type="number" step="1">
  </div>
  <div class="row">
    <label for="editSize">size</label>
    <input id="editSize" type="range" min="80" max="900" step="1">
    <input id="editSizeNum" type="number" step="1">
  </div>
  <div class="row">
    <label for="editPivot">pivot</label>
    <input id="editPivot" type="range" min="0.05" max="0.80" step="0.01">
    <input id="editPivotNum" type="number" min="0.05" max="0.80" step="0.01">
  </div>
  <textarea id="editUrl" spellcheck="false"></textarea>
  <div class="actions">
    <button id="copyUrl" type="button">Copy</button>
    <button id="resetEdit" type="button">Reset</button>
  </div>
  <div class="hint">Drag the mascot to position it. Use the copied URL in OBS without edit mode.</div>
</div>

<script>
(() => {
  "use strict";

  const P = new URLSearchParams(location.search);
  const num = (k, d) => { const v = parseFloat(P.get(k)); return isFinite(v) ? v : d; };
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

  const SET     = (P.get("set") || "deer").replace(/[^\w.-]/g, "");
  const ANCHOR  = P.get("anchor") || "bottom-right";
  const MARGIN  = num("margin", 48);
  const EASE    = Math.min(1, Math.max(0.01, num("ease", 0.18)));
  const AIMEASE = Math.min(1, Math.max(0.01, num("aimease", 0.22)));
  const HOLD    = Math.min(0.45, Math.max(0, num("hold", 0.24)));
  const MAXRATE = num("maxrate", 900);
  const FLIP    = P.get("flip") === "1";
  const DIR     = P.get("dir");
  const EDIT    = P.get("edit") === "1";
  const DEBUG   = P.get("debug") === "1";
  const STORE   = "mascot.edit." + SET;
  const PLACE   = (P.get("place") || "placement.json").replace(/[^\w./-]/g, "");
  const OVERLAY = (P.get("overlay") || "").replace(/[^\w-]/g, "");
  const SET_DIR = "sets/" + SET + "/";
  const PLACE_DIR = OVERLAY ? "../overlays/" + OVERLAY + "/mascot/" : "";
  const WS_URL  = P.get("host") || "ws://127.0.0.1:4455";
  const WS_PW   = P.get("pw") || "";

  const el  = document.getElementById("mascot");
  const hud = document.getElementById("hud");
  const editor = document.getElementById("editor");
  if (DEBUG) hud.classList.add("on");
  if (EDIT) document.body.classList.add("editing");

  function readSaved() {
    if (!EDIT) return {};
    try { return JSON.parse(localStorage.getItem(STORE) || "{}") || {}; }
    catch (e) { return {}; }
  }

  const saved = readSaved();
  const cfg = {
    x: P.has("x") ? num("x", innerWidth / 2) : saved.x,
    y: P.has("y") ? num("y", innerHeight / 2) : saved.y,
    size: num("size", isFinite(saved.size) ? saved.size : 320),
    pivot: num("pivot", isFinite(saved.pivot) ? saved.pivot : 0.30),
  };

  let man = null;          // manifest
  let cellW = 0, cellH = 0;
  let cur = 0, target = 0, wanted = 0; // degrees, 0 = gaze up, clockwise
  let shown = -1;
  let raf = 0, lastT = 0;
  let src = "waiting";
  let cursor = null;       // {x, y} in canvas px
  let places = null;       // placement.json, or null when place=off
  let scene = null;        // current OBS scene name
  let sceneVia = "-";      // which path told us
  let placed = false;      // has a scene ever positioned us

  /* ---- geometry ------------------------------------------------------- */

  function hasExplicitPosition() {
    return isFinite(cfg.x) || isFinite(cfg.y);
  }

  function pivotPoint() {
    const W = innerWidth, H = innerHeight;
    if (hasExplicitPosition()) {
      return {
        x: isFinite(cfg.x) ? cfg.x : W / 2,
        y: isFinite(cfg.y) ? cfg.y : H / 2,
      };
    }
    const halfW = cellW / 2, top = cellH * cfg.pivot;
    switch (ANCHOR) {
      case "bottom-left":  return { x: MARGIN + halfW,     y: H - MARGIN - cellH + top };
      case "top-right":    return { x: W - MARGIN - halfW, y: MARGIN + top };
      case "top-left":     return { x: MARGIN + halfW,     y: MARGIN + top };
      case "center":       return { x: W / 2,              y: H / 2 };
      default:             return { x: W - MARGIN - halfW, y: H - MARGIN - cellH + top };
    }
  }

  function resizeSprite() {
    if (!man) return;
    const k = cfg.size / man.cell.h;
    cellW = man.cell.w * k;
    cellH = cfg.size;
    el.style.backgroundSize =
      (man.sheet_size.w * k) + "px " + (man.sheet_size.h * k) + "px";
    shown = -1;
  }

  function place() {
    const p = pivotPoint();
    el.style.left   = (p.x - cellW / 2) + "px";
    el.style.top    = (p.y - cellH * cfg.pivot) + "px";
    el.style.width  = cellW + "px";
    el.style.height = cellH + "px";
    el.style.transform = FLIP ? "scaleX(-1)" : "";
    updateEditor();
  }

  /* ---- sprite --------------------------------------------------------- */

  function norm(deg) {
    return ((deg % 360) + 360) % 360;
  }

  function shortest(from, to) {
    return ((to - from + 540) % 360) - 180;
  }

  function hasFrameAngles() {
    return Array.isArray(man.angles) && man.angles.length === man.frames;
  }

  function angleFor(idx, dpf, direction) {
    if (hasFrameAngles()) return norm(Number(man.angles[idx]) || 0);
    const deg = idx * dpf;
    return direction === "counterclockwise" ? norm(360 - deg) : norm(deg);
  }

  function frameFor(deg, dpf, direction) {
    if (!hasFrameAngles()) {
      const sourceDeg = direction === "counterclockwise" ? norm(360 - deg) : deg;
      return Math.round(sourceDeg / dpf) % man.frames;
    }

    let best = 0, bestDist = Infinity;
    for (let i = 0; i < man.frames; i++) {
      const dist = Math.abs(shortest(angleFor(i, dpf, direction), deg));
      if (dist < bestDist) {
        best = i;
        bestDist = dist;
      }
    }
    return best;
  }

  function draw(deg) {
    const n = man.frames;
    const dpf = man.degrees_per_frame || (360 / n);
    const direction = DIR || man.direction || "clockwise";
    const sourceDeg = FLIP ? norm(360 - deg) : norm(deg);
    const next = frameFor(sourceDeg, dpf, direction);

    let idx = next;
    if (shown >= 0 && next !== shown) {
      const heldCenter = angleFor(shown, dpf, direction);
      const heldDistance = Math.abs(shortest(heldCenter, sourceDeg));
      if (heldDistance < dpf * (0.5 + HOLD)) idx = shown;
    }

    if (idx === shown) return;
    shown = idx;
    const k = cellH / man.cell.h;
    const col = idx % man.cols, row = (idx / man.cols) | 0;
    el.style.backgroundPosition =
      (-col * man.cell.w * k) + "px " + (-row * man.cell.h * k) + "px";
  }

  /* ---- animation ------------------------------------------------------ */

  function tick(t) {
    const dt = lastT ? Math.min(0.1, (t - lastT) / 1000) : 0.016;
    lastT = t;

    let aimDelta = shortest(target, wanted);
    target = norm(target + aimDelta * AIMEASE);

    let d = shortest(cur, target);
    const cap = MAXRATE * dt;
    let stepped = d * EASE;
    if (Math.abs(stepped) > cap) stepped = Math.sign(stepped) * cap;
    cur = norm(cur + stepped);

    draw(cur);
    if (DEBUG) paintHud(d);

    if (Math.abs(d) > 0.4 || Math.abs(aimDelta) > 0.4) {
      raf = requestAnimationFrame(tick);
    } else {
      target = wanted;
      cur = target;
      draw(cur);
      raf = 0; lastT = 0;                          // settled -- idle cost zero
    }
  }

  function wake() { if (!raf) { lastT = 0; raf = requestAnimationFrame(tick); } }

  function aimAt(px, py) {
    cursor = { x: px, y: py };
    const p = pivotPoint();
    const dx = px - p.x, dy = py - p.y;
    if (Math.hypot(dx, dy) < 6) return;            // cursor on the pivot
    wanted = norm(Math.atan2(dx, -dy) * 180 / Math.PI);
    wake();
  }

  /* ---- input ---------------------------------------------------------- */

  function connect() {
    let es;
    try { es = new EventSource("/cursor"); }
    catch (e) { src = "no bridge"; return; }

    es.onopen = () => { src = "bridge"; };
    es.onerror = () => { src = "bridge down, retrying"; };  // EventSource self-heals
    es.onmessage = (ev) => {
      let d; try { d = JSON.parse(ev.data); } catch (e) { return; }
      src = "bridge";
      aimAt(d.x * innerWidth, d.y * innerHeight);
    };
  }

  // Real mouse events never fire inside OBS, but they do in a normal browser --
  // which is how you test all of this without the bridge running.
  addEventListener("mousemove", (e) => {
    src = "mousemove (browser)";
    aimAt(e.clientX, e.clientY);
  });

  addEventListener("resize", () => {
    place();
    syncEditor();
    shown = -1;
    draw(cur);
  });

  /* ---- scenes --------------------------------------------------------- */

  /* Camera space, so nothing here has to know the comic page exists. A scene
     the placement file does not name hides the mascot rather than leaving it
     stranded wherever the last scene put it. */
  function applyPlacement(name) {
    if (!places) return;                       // place=off
    const spot = (places.scenes || {})[name];

    if (!spot || spot.hidden) {
      el.classList.add("offscene");
      return;
    }

    /* First placement must not slide in from wherever the anchor defaulted
       to -- that reads as a glitch on OBS startup. */
    if (!placed) el.classList.add("nomove");

    cfg.x = Number(spot.x);
    cfg.y = Number(spot.y);
    if (isFinite(Number(spot.size))) cfg.size = Number(spot.size);
    if (isFinite(Number(spot.pivot))) cfg.pivot = Number(spot.pivot);

    resizeSprite();
    place();
    draw(cur);
    el.classList.remove("offscene");

    if (!placed) {
      placed = true;
      requestAnimationFrame(() => el.classList.remove("nomove"));
    }
  }

  function setScene(name, via) {
    if (!name || name === scene) return;
    scene = name;
    sceneVia = via;
    applyPlacement(name);
    syncEditor();
    if (DEBUG) paintHud();
  }

  /* --- path A: window.obsstudio ---------------------------------------- */
  addEventListener("obsSceneChanged", (e) =>
    setScene(e.detail && e.detail.name, "obsstudio"));

  /* --- path B: obs-websocket v5, for the startup seed ------------------- */
  /* getCurrentScene() answers null in a nested source until the first switch,
     so without this the mascot stays hidden until you press a button. The
     socket is only a seed and a backup: if it never connects, path A still
     drives every switch from then on. */

  const K = [
    0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1,
    0x923f82a4, 0xab1c5ed5, 0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3,
    0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174, 0xe49b69c1, 0xefbe4786,
    0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
    0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147,
    0x06ca6351, 0x14292967, 0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13,
    0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85, 0xa2bfe8a1, 0xa81a664b,
    0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a,
    0x5b9cca4f, 0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208,
    0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2,
  ];
  const rotr = (x, n) => ((x >>> n) | (x << (32 - n))) >>> 0;

  /* Hand-rolled because crypto.subtle needs a secure context, and this page
     is served over plain http from the bridge. Same routine as overlay.html. */
  function sha256(bytes) {
    const len = bytes.length;
    const buf = new Uint8Array(((len + 9 + 63) >> 6) << 6);
    buf.set(bytes);
    buf[len] = 0x80;
    const dv = new DataView(buf.buffer);
    dv.setUint32(buf.length - 4, (len * 8) >>> 0, false);
    dv.setUint32(buf.length - 8, Math.floor((len * 8) / 4294967296), false);

    let H = [
      0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c,
      0x1f83d9ab, 0x5be0cd19,
    ];
    const w = new Uint32Array(64);

    for (let i = 0; i < buf.length; i += 64) {
      for (let j = 0; j < 16; j++) w[j] = dv.getUint32(i + j * 4, false);
      for (let j = 16; j < 64; j++) {
        const a = w[j - 15], b = w[j - 2];
        const s0 = (rotr(a, 7) ^ rotr(a, 18) ^ (a >>> 3)) >>> 0;
        const s1 = (rotr(b, 17) ^ rotr(b, 19) ^ (b >>> 10)) >>> 0;
        w[j] = (w[j - 16] + s0 + w[j - 7] + s1) >>> 0;
      }
      let [a, b, c, d, e2, f, g, h] = H;
      for (let j = 0; j < 64; j++) {
        const S1 = (rotr(e2, 6) ^ rotr(e2, 11) ^ rotr(e2, 25)) >>> 0;
        const ch = ((e2 & f) ^ (~e2 & g)) >>> 0;
        const t1 = (h + S1 + ch + K[j] + w[j]) >>> 0;
        const S0 = (rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) >>> 0;
        const maj = ((a & b) ^ (a & c) ^ (b & c)) >>> 0;
        const t2 = (S0 + maj) >>> 0;
        h = g; g = f; f = e2; e2 = (d + t1) >>> 0;
        d = c; c = b; b = a; a = (t1 + t2) >>> 0;
      }
      H = H.map((v, k) => (v + [a, b, c, d, e2, f, g, h][k]) >>> 0);
    }
    const out = new Uint8Array(32);
    const odv = new DataView(out.buffer);
    H.forEach((v, i) => odv.setUint32(i * 4, v, false));
    return out;
  }

  const utf8 = (str) => new TextEncoder().encode(str);
  const b64 = (bytes) => btoa(String.fromCharCode(...bytes));
  const catBytes = (a, b) => {
    const r = new Uint8Array(a.length + b.length);
    r.set(a); r.set(b, a.length);
    return r;
  };
  const authString = (pw, salt, challenge) =>
    b64(sha256(catBytes(utf8(b64(sha256(utf8(pw + salt)))), utf8(challenge))));

  let obsWs = null, obsBackoff = 1000;

  function connectOBS() {
    if (!places) return;                       // nothing to place, nothing to ask
    try { obsWs = new WebSocket(WS_URL); }
    catch (e) { return setTimeout(connectOBS, obsBackoff); }

    obsWs.onclose = () => {
      obsWs = null;
      setTimeout(connectOBS, obsBackoff);
      obsBackoff = Math.min(obsBackoff * 2, 8000);
    };
    obsWs.onerror = () => {};                  // onclose always follows

    obsWs.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }

      if (m.op === 0) {
        const d = { rpcVersion: 1, eventSubscriptions: 4 };
        if (m.d.authentication) {
          if (!WS_PW) return obsWs.close();     // needs a password, has none
          d.authentication = authString(
            WS_PW, m.d.authentication.salt, m.d.authentication.challenge);
        }
        return obsWs.send(JSON.stringify({ op: 1, d }));
      }

      if (m.op === 2) {
        obsBackoff = 1000;
        return obsWs.send(JSON.stringify({
          op: 6, d: { requestType: "GetSceneList", requestId: "seed", requestData: {} },
        }));
      }

      if (m.op === 5 && m.d.eventType === "CurrentProgramSceneChanged")
        return setScene(m.d.eventData.sceneName, "websocket");

      if (m.op === 7 && m.d.requestId === "seed" && m.d.requestStatus.result)
        return setScene(m.d.responseData.currentProgramSceneName, "websocket/seed");
    };
  }

  /* ---- editor --------------------------------------------------------- */

  const editX = document.getElementById("editX");
  const editY = document.getElementById("editY");
  const editSize = document.getElementById("editSize");
  const editPivot = document.getElementById("editPivot");
  const editXNum = document.getElementById("editXNum");
  const editYNum = document.getElementById("editYNum");
  const editSizeNum = document.getElementById("editSizeNum");
  const editPivotNum = document.getElementById("editPivotNum");
  const editUrl = document.getElementById("editUrl");
  const copyUrl = document.getElementById("copyUrl");
  const resetEdit = document.getElementById("resetEdit");
  const editHint = document.querySelector("#editor .hint");

  function saveEdit() {
    if (!EDIT) return;
    localStorage.setItem(STORE, JSON.stringify({
      x: Math.round(pivotPoint().x),
      y: Math.round(pivotPoint().y),
      size: Math.round(cfg.size),
      pivot: Number(cfg.pivot.toFixed(2)),
    }));
  }

  function finalUrl() {
    const p = new URLSearchParams();
    p.set("set", SET);
    p.set("x", String(Math.round(pivotPoint().x)));
    p.set("y", String(Math.round(pivotPoint().y)));
    p.set("size", String(Math.round(cfg.size)));
    p.set("pivot", cfg.pivot.toFixed(2));
    if (P.has("ease")) p.set("ease", P.get("ease"));
    if (P.has("aimease")) p.set("aimease", P.get("aimease"));
    if (P.has("hold")) p.set("hold", P.get("hold"));
    if (P.has("maxrate")) p.set("maxrate", P.get("maxrate"));
    if (FLIP) p.set("flip", "1");
    if (DIR) p.set("dir", DIR);
    return location.origin + location.pathname + "?" + p.toString();
  }

  /* The entry to paste into placement.json for whatever scene is on air.
     Dragging authors the numbers; this is just the shape they go in. */
  function placementSnippet() {
    if (!scene) return "// no scene yet -- switch to one in OBS, or add ?scene=NAME";
    return '"' + scene + '": ' + JSON.stringify({
      x: Math.round(pivotPoint().x),
      y: Math.round(pivotPoint().y),
      size: Math.round(cfg.size),
      pivot: Number(cfg.pivot.toFixed(2)),
    });
  }

  function syncEditor() {
    if (!EDIT) return;
    const p = pivotPoint();
    editX.max = Math.max(1, innerWidth);
    editY.max = Math.max(1, innerHeight);
    editX.value = editXNum.value = String(Math.round(p.x));
    editY.value = editYNum.value = String(Math.round(p.y));
    editSize.value = editSizeNum.value = String(Math.round(cfg.size));
    editPivot.value = editPivotNum.value = cfg.pivot.toFixed(2);
    editUrl.value = places ? placementSnippet() : finalUrl();
    editHint.textContent = places
      ? "Drag the mascot, then paste this line into "
        + (OVERLAY ? "overlays/" + OVERLAY + "/mascot/" : "mascot/") + PLACE + " "
        + "under \"scenes\". Switch scenes in OBS to author the next one."
      : "Drag the mascot to position it. Use the copied URL in OBS without "
        + "edit mode.";
  }

  function updateEditor() {
    if (!EDIT) return;
    syncEditor();
  }

  function applyEditorValues() {
    const nextX = parseFloat(editX.value);
    const nextY = parseFloat(editY.value);
    const nextSize = parseFloat(editSize.value);
    const nextPivot = parseFloat(editPivot.value);
    cfg.x = clamp(isFinite(nextX) ? nextX : pivotPoint().x, 0, innerWidth);
    cfg.y = clamp(isFinite(nextY) ? nextY : pivotPoint().y, 0, innerHeight);
    cfg.size = clamp(isFinite(nextSize) ? nextSize : cfg.size, 80, 900);
    cfg.pivot = clamp(isFinite(nextPivot) ? nextPivot : cfg.pivot, 0.05, 0.80);
    resizeSprite();
    place();
    draw(cur);
    saveEdit();
  }

  function bindRange(range, number) {
    range.addEventListener("input", () => {
      number.value = range.value;
      applyEditorValues();
    });
    number.addEventListener("input", () => {
      range.value = number.value;
      applyEditorValues();
    });
  }

  if (EDIT) {
    bindRange(editX, editXNum);
    bindRange(editY, editYNum);
    bindRange(editSize, editSizeNum);
    bindRange(editPivot, editPivotNum);

    let drag = null;
    el.addEventListener("pointerdown", (e) => {
      if (!man) return;
      /* The 980ms travel easing makes dragging feel broken -- the mascot
         chases the pointer a beat behind. Off while a drag is live. */
      el.classList.add("nomove");
      const p = pivotPoint();
      drag = { dx: e.clientX - p.x, dy: e.clientY - p.y };
      el.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    el.addEventListener("pointermove", (e) => {
      if (!drag) return;
      cfg.x = clamp(e.clientX - drag.dx, 0, innerWidth);
      cfg.y = clamp(e.clientY - drag.dy, 0, innerHeight);
      place();
      saveEdit();
      e.preventDefault();
    });
    el.addEventListener("pointerup", (e) => {
      drag = null;
      el.classList.remove("nomove");
      try { el.releasePointerCapture(e.pointerId); } catch (_e) {}
    });

    copyUrl.addEventListener("click", () => {
      editUrl.select();
      const text = editUrl.value;
      const copied = navigator.clipboard && navigator.clipboard.writeText
        ? navigator.clipboard.writeText(text)
        : Promise.reject();
      copied.catch(() => document.execCommand("copy")).finally(() => {
        editor.classList.add("copied");
        setTimeout(() => editor.classList.remove("copied"), 700);
      });
    });

    resetEdit.addEventListener("click", () => {
      localStorage.removeItem(STORE);
      cfg.x = undefined;
      cfg.y = undefined;
      cfg.size = num("size", 320);
      cfg.pivot = num("pivot", 0.30);
      resizeSprite();
      place();
      draw(cur);
    });
  }

  /* ---- hud ------------------------------------------------------------ */

  function paintHud(delta) {
    const p = pivotPoint();
    hud.textContent =
      "set      " + SET + "\n" +
      "input    " + src + "\n" +
      "scene    " + (scene || "-") + "  (" + sceneVia + ")\n" +
      "placed   " + (places
        ? (places.scenes && places.scenes[scene] ? "yes" : "hidden on this scene")
        : "place=off") + "\n" +
      "canvas   " + innerWidth + "x" + innerHeight + "\n" +
      "pivot    " + p.x.toFixed(0) + ", " + p.y.toFixed(0) + "\n" +
      "cursor   " + (cursor ? cursor.x.toFixed(0) + ", " + cursor.y.toFixed(0) : "-") + "\n" +
      "angle    " + cur.toFixed(1) + " deg  (target " + target.toFixed(1) + ", wanted " + wanted.toFixed(1) + ")\n" +
      "dir      " + (DIR || (man ? man.direction : "") || "clockwise") + "\n" +
      "cell     " + (shown + 1) + " / " + (man ? man.frames : "?") + "\n" +
      "delta    " + (delta === undefined ? "-" : delta.toFixed(1));
  }

  /* ---- boot ----------------------------------------------------------- */

  /* OBS restores its browser sources the moment it launches, which on a fresh
     machine is usually before anyone has started the bridge. A plain fetch
     fails once and the mascot is gone for the session -- so it keeps asking,
     and the page heals itself when the bridge comes up. */
  function retryFetch(url, tries) {
    return fetch(url, { cache: "no-store" })
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .catch(err => {
        if (tries <= 0) throw err;
        const wait = Math.min(8000, 500 * 2 ** (6 - Math.min(6, tries)));
        src = "waiting for " + url;
        if (DEBUG) paintHud();
        return new Promise(res => setTimeout(res, wait))
          .then(() => retryFetch(url, tries - 1));
      });
  }

  /* A missing or broken placement file must not take the mascot down with
     it: fall back to place=off behaviour, which is the anchored, always-on
     mascot this page had before it knew about scenes. */
  function loadPlacement() {
    if (PLACE === "off") return Promise.resolve(null);
    return retryFetch(PLACE_DIR + PLACE, 6)
      .then(j => (j && typeof j === "object" ? j : null))
      .catch(() => {
        src = "no " + PLACE + ", ignoring scenes";
        return null;
      });
  }

  Promise.all([
    retryFetch(SET_DIR + "manifest.json", 60),   // ~8 minutes of patience
    loadPlacement(),
  ])
    .then(([m, pl]) => {
      man = m;
      places = pl;
      el.style.backgroundImage = "url('" + SET_DIR + m.sheet + "')";
      resizeSprite();
      place();
      draw(0);

      /* Scene-driven and no scene yet: stay out of frame rather than sitting
         on the anchor default until OBS says something. */
      if (places && !P.has("x") && !P.has("y")) el.classList.add("offscene");

      // don't fade in until the sheet is actually decoded, or the first
      // paint shows an empty box
      const img = new Image();
      img.onload = img.onerror = () => el.classList.add("ready");
      img.src = SET_DIR + m.sheet;

      if (EDIT) {
        src = "edit mode (browser)";
        syncEditor();
      } else {
        connect();
      }

      /* Scene detection runs in edit mode too, so you can drag the mascot
         into place on the scene you are actually looking at. */
      if (P.has("scene")) setScene(P.get("scene"), "url");
      connectOBS();

      if (DEBUG) paintHud();
    })
    .catch(err => {
      hud.classList.add("on");
      hud.textContent = "could not load " + SET_DIR + "manifest.json\n" + err +
        "\n\nis cursor-bridge.py running, and is ?set= a folder next to mascot.html?";
    });
})();
</script>
